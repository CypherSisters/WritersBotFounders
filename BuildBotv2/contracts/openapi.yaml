        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [knowledge]
      summary: 'Pin one file, and read it through the gate now'
      description: 'Body {"path"}. Reply: as the GET. 400 {"error"}.'
      x-access: owner_device
      x-lane: D125
      responses:
        "200": { description: 'The answer.' }
        "400": { description: 'A plain reason.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/knowledge/pinned/remove:
    post:
      tags: [knowledge]
      summary: 'Unpin one file. The file is never changed'
      description: 'Body {"path"}. Reply: as the GET.'
      x-access: owner_device
      x-lane: D125
      responses:
        "200": { description: 'The answer.' }
        "400": { description: 'A plain reason.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/knowledge/pick:
    post:
      tags: [knowledge]
      summary: 'Windows''s own Open dialog, on this computer'
      description: 'Body {"kind": "file | folder"}. Reply {"path"}, "" if she closed it, or {"path": "", "typed": true, "line"} from another device or off Windows. 409 {"error"}: one is open already.'
      x-access: owner_device
      x-lane: D127
      responses:
        "200": { description: 'The answer.' }
        "400": { description: 'A plain reason.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/packages/sendable:
    get:
      tags: [knowledge]
      summary: 'The installed packages that take files'
      description: 'Reply [{"id", "name", "types", "status"}].'
      x-access: owner
