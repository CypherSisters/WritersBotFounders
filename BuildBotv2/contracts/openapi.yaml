  /v1/toolsmith/apis/{api_id}:
    put:
      tags: [owner_apis]
      summary: 'Edit one API she added; a new address or key place takes her Yes back and ends its Test'
      description: 'Body as the add, any part. Reply {"id", "line", "yes", "consent_id", "card_sha", "title", "lines"}: with no live Yes it asks again if it takes no key or its key is already saved.'
      x-access: owner_device
      x-lane: add-api
      parameters:
        - { name: api_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: 'Saved.' }
        "400": { description: 'Refused, with one plain line. Nothing changed.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: 'No such row.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [owner_apis]
      summary: 'Remove one API she added and take its Yes back; remove_key says whether its key goes too'
      description: 'Body {"remove_key": true | false}, needed for a row with a key (else 400 with ask_remove_key). The vault locked: 423, the row and its Yes are gone, the key stays until she removes it.'
      x-access: owner_device
      x-lane: add-api
      parameters:
        - { name: api_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: 'Removed.' }
        "400": { description: 'Say whether its key goes too. Nothing changed.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: 'No such row.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "423": { description: 'Removed; the vault is locked, so the key stays for now.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/toolsmith/apis/{api_id}/key:
    put:
      tags: [owner_apis]
      summary: 'Keep its key in the vault as toolsmith.api.<id> and raise its own Yes card'
      description: 'Body {"value"}. Refused (400) unless it has a key''s strict shape (web_key_ok). Vault open: saved (200); locked: sealed into the vault inbox (202). Reply {"saved", "line", "yes", "consent_id", "card_sha", "title", "lines"}. The value is never echoed.'
      x-access: owner_device
      x-lane: add-api
      parameters:
        - { name: api_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: 'Saved in the vault.' }
        "202": { description: 'Sealed into the vault inbox.' }
        "400": { description: 'Not a key''s shape; nothing was saved.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: 'No such row.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'No vault yet, or this row takes no key.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [owner_apis]
      summary: 'Take back her Yes for this API and take its key out of the vault'
      description: 'Her Yes goes whatever else happens. Also takes out a key she kept when she removed the row.'
      x-access: owner_device
      x-lane: add-api
      parameters:
        - { name: api_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: 'Removed.' }
        "404": { description: 'No such row, or nothing kept.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "423": { description: 'Her Yes is taken back; the vault is locked, so the key stays for now.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/toolsmith/apis/{api_id}/test:
    post:
      tags: [owner_apis]
      summary: 'One search with her own word, under her own act of pressing Test'
      description: 'Body {"word"}, through the Core''s screen. No plan and no search Yes: her press is recorded as a Yes for this one send, on its own Bridge subject, and taken back when it ends. The Bridge still decides: closed or blocked refuses, on the line. Any private answer for the host refuses; the send uses the address that passed. Reply {"ok", "line", "rows": [{"name", "url", "description"}]}, at most 5, and "answered": true only when it answered 200 and nothing read. Only a Test that reads results turns tested on.'
      x-access: owner_device
      x-lane: add-api
      parameters:
        - { name: api_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: 'Its answer, or a plain line when it was refused or read nothing.' }
        "404": { description: 'No such row.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'Safe mode: Toolsmith is paused until restart.' }
  /v1/github/key:
    get:
      tags: [github]
      summary: 'Whether the owner''s GitHub key is kept in the vault (toolsmith.github), never a value'
      description: 'Built by I18g. Reply {"linked": true | false | null, "vault", "vault_name", "line"}. null: the vault is locked or not set up, so it can''t be told.'
      x-access: owner
      x-lane: I18g
      responses:
        "200": { description: 'Linked or not.' }
    put:
      tags: [github]
      summary: 'Link GitHub: keep the owner''s GitHub key in the vault as toolsmith.github'
      description: 'Built by I18g. Body {"value"}. Refused (400) unless it has a token''s strict shape (github_key_ok). Vault open: saved (200); locked: sealed into the vault inbox (202), as PUT /v1/toolsmith/keys/<provider> does. The value is never echoed. The key is lent only by Toolsmith''s own GitHub search, through the Bridge, to api.github.com, while a build she said Yes to runs.'
      x-access: owner_device
      x-lane: I18g
      responses:
        "200": { description: '{"saved": true, "line"}' }
        "202": { description: '{"saved": false, "line"}: sealed into the inbox.' }
        "400": { description: 'Not a token''s shape.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'The vault is not set up, or can''t take a key now.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [github]
      summary: 'Unlink GitHub: take the owner''s GitHub key out of the vault'
      description: 'Built by I18g. The vault must be open.'
      x-access: owner_device
      x-lane: I18g
      responses:
        "200": { description: '{"deleted": true, "line"}' }
        "404": { description: 'No GitHub key kept.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "423": { description: 'The vault is locked.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/github/code:
    post:
      tags: [github]
      summary: 'Add code from GitHub for the build: a new app from one GitHub project, or that project for a job that is held or found nothing'
      description: 'Built by I18g. Body {"address"} (any common form of a GitHub project address): a new plan, as POST /v1/toolsmith/plan makes, with that project as its only try. Body {"address", "job_id"}: the job (of an earlier build, status held, not_yet or nothing_found) gets a one-job plan with that address as its only try, and the reply adds {"for_job": {"build", "job", "name"}}. Always a new plan with its own card and the ONE Yes: no Yes given before is reused.'
      x-access: owner
      x-lane: I18g
      responses:
        "201": { description: 'The build with its plan, card and consent id.' }
        "400": { description: 'Not a GitHub project address.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: 'No such job.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'The job is not held or empty, or Toolsmith is paused (safe mode).', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
