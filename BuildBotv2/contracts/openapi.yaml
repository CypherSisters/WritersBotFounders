openapi: 3.1.0
info:
  title: PuffPAI Core API
  version: "1"
  description: |
    The Core API: versioned HTTP on 127.0.0.1 (default port 8420), under /v1.
    Source: docs/01_ARCHITECTURE.md "Core API", docs/02_PACKAGE_CONTRACT.md
    ("PUFFPAI_TOKEN"), docs/04_DEVELOPERS.md "The Core API at a glance",
    docs/zones/Z1_VAULT_PROVIDERS.md section 8.

    Every UI, including the default Desktop, uses only this API. The Core API
    holds base routes only; a feature's routes belong to the package that owns it.
    No route ever returns a secret value. No route lets a program say Yes on an
    everyday caller's behalf: consent comes from the owner on a Core card, and
    floor-level cards need the PIN or Windows Hello (D29).

    Status: built so far: GET /v1/health, GET /v1/registry and
    GET /v1/registry/{id} (lane L0); chat, brain and model (lane L2); the vault routes (lane L3)
    except store/move and backup/*; the checklist, events, wizard, settings, notify, theme, people
    and ui groups (lane L5); the packages, pages and providers groups, GET /v1/consent and
    POST /v1/consent/{id}/answer (lane L1; the consent store moves to lane L4's at merge).
    Every other route answers 501 with
    {"error": "not built yet", "lane": "<L#>"} until its lane fills it in.
    Request and response bodies marked PROPOSED are a starting point for that lane.

    Who may call (x-access on each route):
      public        no credential
      owner         an owner credential: a paired device or an owner API key
      program       a program key (puffpai apikey), or any owner credential; a program key opens
                    only these routes (/openai/v1 and /ollama/api) and the public ones, nothing else
      owner_device  a paired device only (an owner sitting at a screen), never a bare API key
      package_ok    owner, or a package's own PUFFPAI_TOKEN (the handler filters to its own items)
      own_row       owner, or a package token for its own Registry row only
      core          refused over HTTP; the Core calls it in process
      toolsmith     Toolsmith's own process only: its Toolsmith token (lane L6, 09 section 3), bound to one
                    build, given on its stdin, revoked when it ends; it opens no other route
    A PUFFPAI_TOKEN may call only: brain, notify, theme, people (GET only), its own
    Registry row, its own Checklist steps, its granted events, and asking for one address for itself
    (02 "How the Core runs a package").

    Two addresses (D49). The Core's own address (8420) serves the Desktop and the API. The
    Desktop is at http://puffpai.localhost:8420 (D79): the paired-device cookie is set and read
    only when Host is exactly puffpai.localhost:<port>, and a POST, PUT, PATCH or DELETE signed
    in by the cookie must send Origin http://puffpai.localhost:<port> (or, with no Origin,
    Sec-Fetch-Site: same-origin) and the header X-PuffPAI: 1, else 403. The cookie counts only
    with its second half in X-PuffPAI-Device (returned once by POST /v1/pair as device_key and
    kept in the Desktop's localStorage); without it the cookie is no cookie (401). A token
    bound that way needs its second half as a bearer too, and a browser token from before D79
    (no second half) is refused everywhere and revoked at Core start. Every puffpai_device (puffpai_device_<port> when the Core is not on 8420, D129)
    cookie sent is checked, never only the first. On 127.0.0.1:<port> and localhost:<port>,
    GET /, /ui/..., /v1/recover and /v1/signin answer 302 to the same path on puffpai.localhost (no cookie
    set or read) and /v1/pair answers 403; bearer callers use 127.0.0.1 as before. Both
    listeners answer 421 to any other Host (DNS rebinding). The package id puffpai is reserved. Bearer and
    X-PuffPAI-Key callers are not affected. /pkg/ answers 404 here. The pages address (8422)
    serves /pkg/ (lane L1 forwards it, adding the package token), /v1/health, and the
    package_ok and own_row routes for a package token. It never reads the cookie and refuses
    owner credentials (403); any other route answers 404 there.

    The home network (D130, built, not yet tested by the owner). On unless she turns it off (off: no listener and no
    socket): one more listener on this bot's Core port + 3, for the Desktop and the API, and one port per package for
    its pages (19100 and up, 100 per bot). The 127.0.0.1 addresses above do not change. A connection is refused before
    any route unless its real socket peer is home-network or link-local (never public, never loopback; no forwarded
    header is read; else 403 in plain text) and its Host is this computer's own home-network address or own name, <hostname>
    or <hostname>.local, on that listener's port (else 421 in plain text). A VPN address in 100.64.0.0/10 counts as neither. There the only credential is a paired browser's cookie,
    puffpai_device_<port>, with its second half in X-PuffPAI-Device; an owner API key, package token, Toolsmith token or
    the terminal key is refused (403). A POST, PUT, PATCH or DELETE must send Origin http://<that Host> (or, with no
    Origin, Sec-Fetch-Site: same-origin) and X-PuffPAI: 1, POST /v1/pair included. A device with no paired cookie gets
    GET / and GET /window/ as a 302 to GET /pair, and 401 for the rest but /v1/pair and /v1/signin. GET / and /ui/ there serve only the built-in Desktop, whichever she chose on this computer. Past that a paired
    device gets everything the owner gets on this computer, the vault, keys, floor-level Yes, the command line and
    shutdown included (the owner's decision for now; roles come later). There is no TLS, so anyone watching the network
    can see PINs and keys and act as that device, the command line included. /openai/v1 and /ollama/api work there with
    the same cookie and second half, not with an owner key. On this address POST /v1/knowledge/files/open answers the
    file itself, POST /v1/window/open and POST /v1/terminal/open open nothing and name a page in {"url"}.
    Package pages there need that package's page pass (GET /v1/network/pages); adopted apps and tries have no port.

    Every package page has its own origin (D53): http://<id>.localhost:8422, on the same
    pages listener. A request with that Host is that package's page (the path is the
    package's own path, so a package origin never reaches the Core API); a *.localhost Host
    that is not a valid package id answers 404. On 127.0.0.1:8422, GET /pkg/<id>/<path> only
    redirects (302) to the package's own origin.
servers:
  - url: http://puffpai.localhost:8420
    description: The Desktop's own address; the only one where the device cookie is set or read (D79)
  - url: http://127.0.0.1:8420
    description: The Core API for programs (bearer tokens); the Desktop's pages only redirect here (D79)
  - url: http://127.0.0.1:8422
    description: The pages address (package pages; no owner login, D49)
  - url: http://{id}.localhost:8422
    description: A package page's own origin (D53)
    variables: { id: { default: freshtable } }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: 'An owner API key, a paired-device token or a package''s PUFFPAI_TOKEN. The Core stores only a SHA-256 hash of each.'
    apiKey:
      type: apiKey
      in: header
      name: X-PuffPAI-Key
      description: 'The same credentials as bearer, for clients that cannot set Authorization.'
    deviceSession:
      type: apiKey
      in: cookie
      name: puffpai_device   # puffpai_device_<port> when the Core is not on 8420 (D129)
      description: 'A paired device''s token as a cookie, host-only on puffpai.localhost, read only when Host is puffpai.localhost:<port>, and counted only with its second half in the X-PuffPAI-Device header (D79). Never read on the pages address (D49); a cookie-signed state change needs the Desktop''s own Origin and X-PuffPAI: 1.'
  requestBodies:
    VaultPin:
      content:
        application/json:
          schema:
            type: object
            required: [pin]
            properties:
              pin: { type: string, format: password, writeOnly: true }
    VaultPinChange:
      content:
        application/json:
          schema:
            type: object
            required: [pin, new_pin]
            properties:
              pin: { type: string, format: password, writeOnly: true }
              new_pin: { type: string, format: password, writeOnly: true }
    VaultUnlock:
      content:
        application/json:
          schema:
            type: object
            required: [secret]
            properties:
              method: { type: string, default: pin }
              secret: { type: string, format: password, writeOnly: true }
              accept_older: { type: boolean, description: 'Her answer to "Your vault went back in time. Use this older copy?"' }
    VaultRecover:
      content:
        application/json:
          schema:
            type: object
            required: [code, new_pin]
            properties:
              code: { type: string, format: password, writeOnly: true }
              new_pin: { type: string, format: password, writeOnly: true }
    VaultCode:
      description: 'The recovery code typed back. Hidden on entry and never echoed (D36(c)).'
      content:
        application/json:
          schema:
            type: object
            required: [code]
            properties:
              code: { type: string, format: password, writeOnly: true }
    VaultWayIn:
      content:
        application/json:
          schema:
            type: object
            required: [secret]
            description: 'Floor-level (D29): the current PIN or the recovery code is needed too.'
            properties:
              kind: { const: passphrase }
              label: { type: string, maxLength: 60 }
              secret: { type: string, format: password, writeOnly: true }
              pin: { type: string, format: password, writeOnly: true, description: 'The current PIN (or give code)' }
              code: { type: string, format: password, writeOnly: true, description: 'The recovery code (or give pin)' }
    VaultCurrentSecret:
      description: 'Floor-level (D29): the current PIN or the recovery code. Hidden on entry and never echoed.'
      content:
        application/json:
          schema:
            type: object
            properties:
              pin: { type: string, format: password, writeOnly: true }
              code: { type: string, format: password, writeOnly: true }
    VaultInboxFile:
      description: 'Her floor-level Yes (D29) to let a sealed inbox box replace a key already saved under that name.'
      content:
        application/json:
          schema:
            type: object
            required: [name, pin]
            properties:
              name: { type: string, pattern: "^[A-Z][A-Z0-9_]{0,63}$" }
              pin: { type: string, format: password, writeOnly: true }
    VaultSecret:
      content:
        application/json:
          schema:
            type: object
            required: [value]
            properties:
              value: { type: string, format: password, writeOnly: true }
              label: { type: string }
              unattended: { type: boolean, description: 'Works after a restart without the PIN (D27). Never with card_backed.' }
              card_backed: { type: boolean }
              seal_if_locked: { type: boolean }
  responses:
    RecoveryCodeOnce:
      description: 'The recovery code, shown once to the owner at a paired device (Cache-Control: no-store). Never stored in the clear, never shown again.'
      content:
        application/json:
          schema:
            type: object
            required: [recovery_code]
            properties:
              recovery_code: { type: string, pattern: "^[2-9CDFHJKLMNPQRTVWXY]{5}(-[2-9CDFHJKLMNPQRTVWXY]{5}){4}$" }
              note: { type: string }
    NotBuilt:
      description: 'Not built yet. The lane named fills it in.'
      content:
        application/json:
          schema:
            type: object
            required: [error, lane]
            properties:
              error: { const: not built yet }
              lane: { type: string, pattern: "^L[0-9]+$" }
    Unauthorized:
      description: 'No credential, or one the Core does not know.'
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: 'The credential is known but may not call this route.'
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: Plain words. }
        code: { type: string, description: 'A short code when there is one. "sign_in": the Core''s own refusal when no credential counted (401, D91 and D92; a client signs out only on this or no code). "pair_code": POST /v1/pair with a wrong, used or old code.' }
    RegistryRow:
      $ref: "./registry.schema.json"
    Step:
      description: 'The one step shape (02 "Setup steps").'
      $ref: "./puffpai-package.schema.json#/$defs/step"
security:
  - bearer: []
  - apiKey: []
  - deviceSession: []

paths:
  /v1/health:
    get:
      tags: [core]
      summary: 'Is the Core up'
      x-access: public
      x-lane: L0
      security: []
      responses:
        "200":
          description: 'The Core answers.'
          content:
            application/json:
              schema:
                type: object
                required: [ok, version, api]
                properties:
                  ok: { type: boolean }
                  version: { type: string }
                  api: { const: v1 }

  /v1/core:
    get:
      tags: [core]
      summary: 'Which bot this Core runs for'
      description: |
        Built by I22b (D91). Reply {"bot_id": "<32 hex>", "pid": <n>}. bot_id is a hash of the Core's bot folder
        (its full path), so `puffpai` can check, with the terminal key, that the Core on the port in
        settings	erminal.json is this bot's own and not another bot's that holds the port now. It says nothing
        about the folder itself.
      x-access: owner
      x-lane: I22b
      responses:
        "200": { description: 'This Core''s bot.' }
        "401": { description: 'No credential this Core knows (another bot''s key).', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/shutdown:
    post:
      tags: [core]
      summary: 'Stop BuildBot: every app and Toolsmith end through their Job Objects, the same stop as Ctrl+C'
      description: |
        Built by I7. `puffpai shutdown` and "Stop BuildBot.cmd" call it with this run's terminal key
        (settings\terminal.json). The owner at this computer only (a paired-device token): an owner API key, a
        package token and a Toolsmith token are refused. The answer comes first; the Core then stops, and its
        stop removes settings\terminal.json last. It stops `puffpai setup` too, at any question or during a build
        (D122): the setup window sees the stop at its next prompt or poll, and ends with a plain line.
      x-access: owner_device
      x-lane: I7
      responses:
        "202": { description: '{"stopping": true, "said": "BuildBot is stopping its apps."}' }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/registry:
    get:
      tags: [registry]
      summary: 'Everything installed'
      x-access: owner
      x-lane: L0
      parameters:
        - { name: kind, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        "200":
          description: 'Every Registry row, sorted by id.'
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/RegistryRow" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/registry/{id}:
    get:
      tags: [registry]
      summary: 'One Registry row'
      x-access: own_row
      x-lane: L0
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 'The row.'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistryRow" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: 'No such package.'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/packages:
    post:
      tags: [packages]
      summary: 'Add a package (the one install path)'
      description: |
        Body: {"source": "<folder | git URL | built-in id | store:<id>>", "link": false}.
        Validates, runs the Drawbridge check and raises ONE Yes card; the reply
        carries the card's consent_id, not an install (01 "Package Manager").
        store:<id> (D89): the row from the official store first, then the owner's sources in order; a
        yanked (id, commit) is refused (409) with its reason; exactly the pinned commit is fetched and only
        the row's folder is installed; the manifest's id and kind must be the row's. origin is
        store:verified only from the official store with tier verified, else store:community. The card
        has "store": {where, tier, repo, path, commit}.
      x-access: owner
      x-lane: L1
      responses: { "202": { description: 'The Yes card: {"consent_id", "id", "card", "floor"}. 400, 403 or 409 with {"error", "problems"} (403: Drawbridge said no, or is not here).' } }
  /v1/packages/available:
    get:
      tags: [packages]
      summary: 'The packages that ship with PuffPAI and are not installed yet (added by lane I8b for the Desktop''s Apps page)'
      description: 'Reply [{"id", "name", "kind", "description", "version", "author", "icon"}]. icon is the manifest icon file as a data: URL (svg, png, webp or jpeg, at most 64 KB; lane I10a, the PuffPAI store), or null. Add one with POST /v1/packages {"source": "<its id>"}: the same checks and the same Yes card as any folder.'
      x-access: owner
      x-lane: I8b
      responses:
        "200": { description: 'The built-in packages not installed.' }
  /v1/store:
    get:
      tags: [packages]
      summary: 'The PuffPAI Store: every store source''s rows, merged (lane store, D89)'
      description: 'Reply {"sources": [{source, official, removable, ok, stale, fetched_at, line, dropped, count}], "packages": [{id, kind, name, description, version, author, license, repo, path, commit, icon?, levels?, verified_by?, abilities?, tier, origin, listed_tier, source, official, used, yanked, yanked_why?, builtin_look, installed}]}. icon is an https address the Desktop never loads (D96). abilities is {tools: {name: description}, examples: {name: [ask]}}, plain text within limits. yanked_why says why a row was pulled; the official list counts for every source. builtin_look marks a second copy of a built-in look, which the Desktop does not show. tier and origin are what the Core will record: verified only for a verified row from the official store; every other row is community. used marks the row store:<id> installs (the official store first, then the owner''s sources in order). A source that can''t be reached shows its last good copy with stale true and a plain line. Query fresh=1 asks every source again now (else a copy from the last 60 s is used, also when the source failed). Query saved=1 reads the saved copies only and never the network, for what runs without the owner asking (D96). Rows that break the store''s row rules are left out (dropped, with a reason). Install one with POST /v1/packages {"source": "store:<id>"}. An installed store package that a store pulled (yanked) gets one Desktop notice offering removal; nothing is removed without the owner.'
      x-access: owner
      x-lane: store
      parameters:
        - { name: fresh, in: query, schema: { type: string } }
        - { name: saved, in: query, schema: { type: string } }
      responses:
        "200": { description: 'The merged store.' }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/store/sources:
    get:
      tags: [packages]
      summary: 'The store sources: the official store (always first, never removable), then the owner''s own'
      x-access: owner
      x-lane: store
      responses:
        "200": { description: '{"sources": [{source, key, official, removable, line}]}.' }
    post:
      tags: [packages]
      summary: 'Add a store source: an https index.json address, or a folder or file on this computer holding one'
      description: 'Body {"source": "<https address | full path>"}. Plain http, other schemes, an address with a name or password, a network share and a relative path are refused (400). The official store (409), a source already added (409), a folder with no index.json (404), more than 20 sources (409). Kept in settings\store.json. Everything from an added source installs as community, whatever its index says.'
      x-access: owner_device
      x-lane: store
      responses:
        "201": { description: '{"added": true, "source", "line"}.' }
        "400": { description: '{"error", "problems"}.' }
        "409": { description: '{"error", "problems"}.' }
    delete:
      tags: [packages]
      summary: 'Remove one of the owner''s store sources'
      description: 'Body {"source"} or query source=. The official store can''t be removed (409); a source not added is 404. Its saved copy is deleted; packages installed from it stay and get no updates from it.'
      x-access: owner_device
      x-lane: store
      parameters:
        - { name: source, in: query, schema: { type: string } }
      responses:
        "200": { description: '{"removed": true, "source", "line"}.' }
        "404": { description: '{"error", "problems"}.' }
        "409": { description: '{"error", "problems"}.' }
  /v1/store/updates:
    get:
      tags: [packages]
      summary: 'Installed store packages whose store source now pins a different commit'
      description: 'Reply {"updates": [{id, name, have: {commit, version, origin}, store: {commit, version, origin, path}, source, stale, line}], "not_found": [{id, name, line}], "sources": [...]}. Apply one with POST /v1/packages/{id}/update: its Yes card first. Query fresh=1 as for GET /v1/store.'
      x-access: owner
      x-lane: store
      parameters:
        - { name: fresh, in: query, schema: { type: string } }
      responses:
        "200": { description: 'The updates.' }
  /v1/packages/{id}:
    delete:
      tags: [packages]
      summary: 'Remove a package'
      description: 'PROPOSED query keep_data=ask|keep|delete. A linked folder is never deleted.'
      x-access: owner
      x-lane: L1
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { "200": { description: 'Removed: {"removed": true, "nothing_running", "folder_removed", "linked_folder_kept", "data_kept"}. 409 with {"question": "keep_data"} while the data choice is open.' } }
  /v1/packages/{id}/start:
    post:
      tags: [packages]
      summary: 'Start through Steward'
      x-access: owner
      x-lane: L1
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { "200": { description: 'The Registry row, status running. 409 with the plain reason.' } }
  /v1/packages/{id}/stop:
    post:
      tags: [packages]
      summary: 'Stop through Steward'
      x-access: owner
      x-lane: L1
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { "200": { description: '{"row", "nothing_running"}.' } }
  /v1/packages/{id}/update:
    post:
      tags: [packages]
      summary: 'Fetch, re-check, show what changed, Yes, swap'
      description: 'Lane I13: a built-in (an install copied from this BuildBot''s own packages folder) is compared with that copy by manifest version and tree hash. Up to date: 200 {"status": "current"}. A system part (desktop, wizard, cloud-avatar) is updated now with an audit line and no card, 200 {"status": "updated", "row"}, unless it adds a host, key or changing tool or a new Drawbridge reason, then it gets the card. An app: 202 {"status": "card"} with the Yes card "<name> has an update" and a Desktop notice. Any other package: fetched again from its source, 202 {"status": "card"}. A store package (D89): the commit its own store source pins now (409 when it is already at it, or that commit is yanked), with its tier as that row says now; the card has "store" with was_commit. Every swap is atomic; a failure puts the old version back (409). Adopted, linked and git packages are never compared with a built-in.'
      x-access: owner_device
      x-lane: L1
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        "200": { description: '{"status": "current" | "updated", "line"} for a built-in.' }
        "202": { description: 'The Yes card and {"what_changed": {version, hosts, install_hosts, keys, changes}}, "status": "card".' }
  /v1/packages/{id}/open/{page}:
    post:
      tags: [packages]
      summary: 'Open a page (in the Desktop, a new tab, or ui.open''s program)'
      description: 'For a page or widget served through /pkg/ (a page or widget id), url is on the package''s own origin: http://{id}.localhost:8422/{path} (D53).'
      x-access: owner
      x-lane: L1
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: page, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: '{"open": "in_desktop" | "new_tab" | "program", "url"}.' } }
  /v1/packages/{id}/frame:
    get:
      tags: [packages]
      summary: 'May this package''s page be shown inside a Home tile, and at what address (D82, D83)'
      description: 'Only a page of PuffPAI''s own origin shows inside the Desktop or the window (D83, the owner 10-30): a rule on the Registry row''s origin, which only the Core writes. An allowlist: built in (origin local: exactly the repo''s folder for this id, or core), from the official PuffPAI store (store:verified or store:community with store.source "official"), or exactly made. Anything else is third party (adopted, github, another local folder, another store, unknown, empty), and always opens in her real browser, in a new tab (D13); its page also answers frame-ancestors ''none''. Read from the Registry row only. kind "page": PuffPAI''s own origin, and its first ui.pages entry has a path or file, no url, and show is not "new_tab"; url is on its own origin, http://{id}.localhost:8422/{path} (D53); always ok. kind "app": any other page; never framed, so ok is false and the line is "<name> opens in your browser, in a new tab."; url is its address for the Open button ({port} filled, any sign-in removed) when that is http or https on 127.0.0.1, localhost or ::1 and not one of the Core''s own ports (the Core address, the pages address, the Bridge proxy, always 8420 to 8422), else its page on the pages address, else "". Nothing is fetched. kind "none": no page. Never 500.'
      x-access: owner
      x-lane: dash
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        "200": { description: '{"ok": bool, "url": str, "kind": "page" | "app" | "none", "sandbox": str (the iframe sandbox for kind page, "allow-scripts allow-forms allow-popups allow-same-origin"; "" otherwise), "running": bool (the row''s status is running), "line": str (plain words for the owner)}.' }
        "404": { description: '{"error"}: nothing installed with that id.' }
  /v1/packages/{id}/logs:
    get:
      tags: [packages]
      summary: 'The package''s log (logs\<id>.log)'
      x-access: owner
      x-lane: L1
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { "200": { description: 'The last lines of logs\<id>.log (text/plain; ?lines=, at most 5000).' } }
  /pkg/{id}/:
    get:
      tags: [pages]
      summary: 'A package''s home page (path /), forwarded like /pkg/{id}/{path}, on the pages address only (D49)'
      x-access: public
      x-lane: L1
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { "200": { description: 'Whatever the package page answers.' } }
    post:
      tags: [pages]
      summary: 'A package page''s own POST to its home path, forwarded (D53: from its own origin only)'
      x-access: public
      x-lane: L1
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { "200": { description: 'Whatever the package page answers.' } }
    put:
      tags: [pages]
      summary: 'A package page''s own PUT to its home path, forwarded like POST (lane I13: its own origin only)'
      x-access: public
      x-lane: I13
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { "200": { description: 'Whatever the package page answers (405 for a static package).' } }
    delete:
      tags: [pages]
      summary: 'A package page''s own DELETE to its home path, forwarded like POST (lane I13: its own origin only)'
      x-access: public
      x-lane: I13
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { "200": { description: 'Whatever the package page answers (405 for a static package).' } }
  /pkg/{id}/{path}:
    get:
      tags: [pages]
      summary: 'A package page, forwarded to 127.0.0.1:{port} with the package token added'
      description: 'Not under /v1 because pages are not API. Served only on the pages address 127.0.0.1:8422 (D49; 404 on the Core''s own address), where there is no owner login, so the forwarding adds the package token. Pages built for PuffPAI show in the Desktop in a frame (D13). D53: reached as http://{id}.localhost:8422/{path} (the package comes from the Host); on 127.0.0.1:8422 a GET here redirects (302) there and anything else is 404. Lane L1: the request goes to the package''s own port only with its own token; Cookie, Authorization, X-PuffPAI-Key and X-PuffPAI are never forwarded; Set-Cookie, WWW-Authenticate, Clear-Site-Data and Access-Control-* never come back; redirects are not followed. A request that is not GET, HEAD or OPTIONS must come from the package''s own origin (Origin: null, other packages, the Core and other websites get 403); a GET from the Core''s own origin gets Access-Control-Allow-Origin for that origin, without credentials.'
      x-access: public
      x-lane: L1
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: path, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: 'Whatever the package page answers.' } }
    post:
      tags: [pages]
      summary: 'A package page''s own POST, forwarded'
      x-access: public
      x-lane: L1
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: path, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: 'Whatever the package page answers.' } }
    put:
      tags: [pages]
      summary: 'A package page''s own PUT, forwarded like POST (lane I13: its own origin only, its own token)'
      x-access: public
      x-lane: I13
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: path, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: 'Whatever the package page answers (405 for a static package).' } }
    delete:
      tags: [pages]
      summary: 'A package page''s own DELETE, forwarded like POST (lane I13: its own origin only, its own token)'
      x-access: public
      x-lane: I13
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: path, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: 'Whatever the package page answers (405 for a static package).' } }

  /v1/providers:
    get:
      tags: [providers]
      summary: 'Which provider fills each zone slot'
      x-access: owner
      x-lane: L1
      responses: { "200": { description: '[{"slot", "contract", "how_many", "installed", "active"}].' } }
  /v1/providers/{slot}:
    put:
      tags: [providers]
      summary: 'Pick the active provider for a one-at-a-time slot'
      description: 'PROPOSED body {"id": "<package id>"}. Raises a Yes card; zone1.vault-store moves go through /v1/vault/store/move.'
      x-access: owner
      x-lane: L1
      parameters: [ { name: slot, in: path, required: true, schema: { type: string } } ]
      responses: { "202": { description: 'The Yes card for the pick: {"consent_id", "card"}.' } }

  /v1/chat:
    post:
      tags: [chat]
      summary: 'One chat turn through Concierge'
      description: 'Body {"text": "...", "conversation": "main"}. Reply {"text", "empty", "notice", "changed", "used", "steps"}: text is the brain''s answer exactly as it said it; changed lists the tool calls with changes: true that really ran; an empty answer is text "" with notice "The brain gave no answer.". Every turn passes the privacy gate first; with no gate nothing runs (503).'
      x-access: owner
      x-lane: L2
      responses:
        "200": { description: 'The answer.' }
        "400": { description: 'No text.' }
        "503": { description: 'The brain cannot answer: {"error", "state"} with the real reason (not_downloaded, timed_out, error, no_gate, not_local, no_model).' }
  /v1/chat/stream:
    post:
      tags: [chat]
      summary: 'The same turn, streamed'
      description: 'Same body. NDJSON lines: {"type": "progress"|"token"|"ask"|"answered"|"open"|"tool_done", ...}, then {"type": "done", ...the /v1/chat reply} or {"type": "error", "error", "state"}.'
      x-access: owner
      x-lane: L2
      responses:
        "200": { description: 'application/x-ndjson event lines.' }
        "400": { description: 'No text.' }
  /v1/chat/history:
    get:
      tags: [chat]
      summary: 'One conversation''s words, for her paired browser (the PuffPAI window)'
      description: 'Query conversation (default main) and limit (1 to 500, default 200). Reply [{"role", "content", "at", "changed"}], oldest first, in the store''s locked form: handles, never held values (X6).'
      x-access: owner_device
      x-lane: window
      responses:
        "200": { description: 'The lines.' }
        "400": { description: 'A conversation id or limit that can''t be used.' }
  /v1/chat/tool:
    post:
      tags: [chat]
      summary: 'Call one tool by name (pages and UIs), through Drawbridge'
      description: 'Body {"tool": "<pkg>.<name>", "args": {}}. Reply {"ok", "result" | "error", "asked", "tool"}. A tool in abilities.changes asks the owner''s Yes first, as in chat.'
      x-access: owner
      x-lane: L2
      responses:
        "200": { description: 'It ran.' }
        "400": { description: 'Unknown or wrong arguments, refused before it ran: {"ok": false, "error", "bad_args": true}.' }
        "422": { description: 'It did not run or did not work: {"ok": false, "error"}.' }
        "503": { description: 'The brain cannot run: {"error", "state"}.' }
  /v1/brain/chat:
    post:
      tags: [brain]
      summary: 'A package asks the local model for text or image reading'
      description: 'Body {"messages": [{"role", "content"}], "images": [base64, ...]}. Reply {"text", "usage": {"prompt_tokens", "completion_tokens"}, "model"} (model: the local model that answered, so an app can say which model read its picture; lane I19b). Each answered ask with images is counted for that model (GET /v1/models/used). Packages never call the model server directly. The gate runs with vault_open=False: a package gets handles only, never held values. images is optional and allowed only when the model reads pictures (its profile says vision).'
      x-access: package_ok
      x-lane: L2
      responses:
        "200": { description: 'The answer.' }
        "400": { description: 'No messages, or pictures for a model that cannot read them.' }
        "503": { description: 'The brain cannot answer: {"error", "state": not_downloaded|loading|timed_out|error|no_gate|not_local|no_model}.' }
  /v1/model:
    put:
      tags: [model]
      summary: 'Change the brain outside setup (D133)'
      description: 'Body {"model": "<name>"}. In this order: a name, its Ollama answers, that Ollama has it. Nothing is saved until all three hold. Reply: as GET, plus a plain line.'
      x-access: owner_device
      x-lane: dev-cli
      responses:
        "200": { description: 'Saved.' }
        "400": { description: 'No name, or not on this computer (code model_missing).', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: 'Nothing answers at its address. Nothing was saved.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    get:
      tags: [model]
      summary: 'The owner''s model-slot settings'
      description: 'Reply {"settings": {runtime, address, model, context, tool_budget, timeout_s, lan_hosts, pinned, effective: {context, tool_budget, think, where}}, "state": {state: not_downloaded|loading|ready|timed_out|error, model, reason, done_gb?, size_gb?, in_memory?}} (D36(d)).'
      x-access: owner
      x-lane: L2
      responses:
        "200": { description: 'Settings and the brain''s state.' }
  /v1/model/menu:
    get:
      tags: [model]
      summary: 'Models this computer can run, with download sizes (D36(e))'
      description: 'Reply {"census", "menu": {options (strongest first, one recommended: true), recommended {id, label, reason, rule, installed, disk_gb, fit}, already_here, too_big, message, hardware_class, total_ram_gb, free_disk_gb}}.'
      x-access: owner
      x-lane: L2
      responses:
        "200": { description: 'The census and the brain menu.' }

  /openai/v1/models:
    get:
      tags: [openai_api]
      summary: 'The bot as one OpenAI-style model'
      description: 'Reply {"object": "list", "data": [{"id": "puffpai", "object": "model", "created", "owned_by": "puffpai-local", "permission": [], "root": "puffpai", "parent": null}]}.'
      x-access: program
      x-lane: api-tools
      responses:
        "200": { description: 'The list.' }
  /openai/v1/chat/completions:
    post:
      tags: [openai_api]
      summary: 'One chat turn in the OpenAI shape (Home Assistant, OpenAI-style programs)'
      description: 'Body {"messages": [{"role", "content"}], "stream"?, "conversation_id"?, "user"?}. The last user message is the question; system messages are dropped; earlier turns are not replayed (the bot keeps the conversation). Conversation: conversation_id, else user, else "api"; an id that can''t be used becomes a short hash. Reply {"id": "chatcmpl-...", "object": "chat.completion", "created", "model": "puffpai", "choices": [{"index": 0, "message": {"role": "assistant", "content"}, "finish_reason": "stop"}], "usage": zeros}. stream true: text/event-stream "data: {chat.completion.chunk}" lines with delta content per token, a final chunk with empty delta, finish_reason stop and puffpai_meta {"changed": [tool names], "notice"} or {"error"}, then "data: [DONE]". Never the owner''s "You" notes.'
      x-access: program
      x-lane: api-tools
      responses:
        "200": { description: 'The answer, or the event stream.' }
        "400": { description: '{"error": {"message"}}: no messages, or no user message.' }
        "503": { description: 'The brain cannot answer: {"error", "state"}, as /v1/chat.' }
  /ollama/api/tags:
    get:
      tags: [openai_api]
      summary: 'The bot as one Ollama-style model'
      description: 'Reply {"models": [{"name": "puffpai", "model": "puffpai", "modified_at", "size": 0, "digest": "puffpai", "details": {...}}]}.'
      x-access: program
      x-lane: api-tools
      responses:
        "200": { description: 'The list.' }
  /ollama/api/chat:
    post:
      tags: [openai_api]
      summary: 'One chat turn in the Ollama shape'
      description: 'Body {"messages", "stream"?, "conversation_id"?, "user"?}, the same rules as /openai/v1/chat/completions. Reply {"model": "puffpai", "created_at", "message": {"role": "assistant", "content"}, "done": true, "total_duration": 0, "load_duration": 0, "prompt_eval_count": 0, "eval_count": 0}. stream true: application/x-ndjson, one line per token with done false, then a last line with content "" and done true.'
      x-access: program
      x-lane: api-tools
      responses:
        "200": { description: 'The answer, or NDJSON lines.' }
        "400": { description: '{"error"}: no messages, or no user message.' }
        "503": { description: 'The brain cannot answer: {"error", "state"}.' }

  /v1/models:
    get:
      tags: [models]
      summary: 'The local models and what each one is used for (lane I17)'
      description: 'Reply {"installed": [{name, size_gb, params, used_for: [roles]}], "roles": {chat, code, vision, fast}, "catalog": [{id, label, roles, params_b, strength, min_ram_gb, rec_ram_gb, disk_gb, tools, installed, fit, fits, download}], "recommended": {role: [ids, best first]}, "words", "pulls": {model: {state: asking|downloading|done|failed|declined|no_answer, line, consent_id, done_gb?, size_gb?}}, "problem", "pull_host", "bridge", "total_ram_gb", "free_disk_gb"}. Chat''s model is settings\model.json''s brain; the other roles are settings\models.json.'
      x-access: owner_device
      x-lane: I17
      responses:
        "200": { description: 'The models, the catalog rows per role and the role map.' }
  /v1/models/roles:
    put:
      tags: [models]
      summary: 'Set roles to installed models. Body {"<role>": "<model>"}; "" takes a role back to chat''s model; chat always has one (400)'
      x-access: owner_device
      x-lane: I17
      responses:
        "200": { description: 'The role map, {"roles": {...}}.' }
        "400": { description: 'Not a role, a model not on this computer, or chat left with none.' }
  /v1/models/pull:
    post:
      tags: [models]
      summary: 'Download a catalog model that fits this computer, after its own Yes card (model, size, host). Body {"model"}'
      description: 'Reply 202 {consent_id, card_sha, title, lines}. The download starts only after her Yes on that card; Ollama downloads it itself from registry.ollama.ai, around the Bridge. 400 not in the list or does not fit, 409 already here or being added, 503 no model server.'
      x-access: owner_device
      x-lane: I17
      responses:
        "202": { description: 'The Yes card is waiting (the same card when one waits already).' }
  /v1/models/used:
    get:
      tags: [models]
      summary: 'What each role''s model has done (lane I19b): for vision, how many pictures apps sent it'
      description: 'Reply {"<role>": {model, own, count, last_at, last_by}} for chat, code, vision and fast. model is the model doing the role now (chat''s when the role has none of its own; own says which). count, last_at and last_by (the app''s id) are kept per model in settings\model_use.json: counts only, never a picture or an answer. No model server is asked.'
      x-access: owner_device
      x-lane: I19b
      responses:
        "200": { description: 'Per role, its model and what it has done.' }
  /v1/models/pull/cancel:
    post:
      tags: [models]
      summary: 'Stop a model being added. Body {"model"}: its Yes card closes, or its download stops; it is marked cancelled and no role is set. 404 when nothing is being added'
      x-access: owner_device
      x-lane: I17
      responses:
        "200": { description: '{"cancelled", "pull"}' }
  /v1/vault/status:
    get:
      tags: [vault]
      summary: 'not_set_up | open | locked | missing | throttled, ways in (labels only), store health, idle time left, inbox waiting'
      x-access: owner
      x-lane: L3
      responses: { "200": { description: 'Vault status; never a value' } }
  /v1/vault/setup:
    post:
      tags: [vault]
      summary: 'Make the vault with a PIN or passphrase; returns the recovery code ONCE (no-store). 409 if already set up, 400 weak PIN'
      x-access: owner_device
      x-lane: L3
      requestBody: { $ref: "#/components/requestBodies/VaultPin" }
      responses: { "201": { $ref: "#/components/responses/RecoveryCodeOnce" } }
  /v1/vault/unlock:
    post:
      tags: [vault]
      summary: 'Unlock. Body {"method": "pin | recovery | factor:<id>", "secret": "..."}; 401 wrong, 429 + retry_after, 503 store missing, 409 rolled_back'
      x-access: owner_device
      x-lane: L3
      requestBody: { $ref: "#/components/requestBodies/VaultUnlock" }
      responses: { "200": { description: '{"state": "open"}' } }
  /v1/vault/lock:
    post:
      tags: [vault]
      summary: 'Lock; ends every lease'
      x-access: owner
      x-lane: L3
      responses: { "200": { description: '{"state": "locked"}' } }
  /v1/vault/recover:
    post:
      tags: [vault]
      summary: 'Body {"code": "...", "new_pin": "..."}; re-keys the vault and returns the new recovery code once'
      x-access: owner_device
      x-lane: L3
      requestBody: { $ref: "#/components/requestBodies/VaultRecover" }
      responses: { "200": { $ref: "#/components/responses/RecoveryCodeOnce" } }
  /v1/vault/pin:
    post:
      tags: [vault]
      summary: 'Change the PIN (vault open). Body {"pin": "...", "new_pin": "..."}; a rewrap only'
      x-access: owner_device
      x-lane: L3
      requestBody: { $ref: "#/components/requestBodies/VaultPinChange" }
      responses: { "200": { description: '{"ok": true}' } }
  /v1/vault/recovery-code/rotate:
    post:
      tags: [vault]
      summary: 'New recovery code (vault open). Body {"pin": "..."}; returns the new code once'
      x-access: owner_device
      x-lane: L3
      requestBody: { $ref: "#/components/requestBodies/VaultPin" }
      responses: { "200": { $ref: "#/components/responses/RecoveryCodeOnce" } }
  /v1/vault/recovery-code/test:
    post:
      tags: [vault]
      summary: 'Check the recovery code without opening (own throttle). Body {"code": "..."}; reply {"ok": bool}, never the code'
      x-access: owner_device
      x-lane: L3
      requestBody: { $ref: "#/components/requestBodies/VaultCode" }
      responses: { "200": { description: '{"ok": true | false}' } }
  /v1/vault/ways-in:
    get:
      tags: [vault]
      summary: 'Ways in (id, kind, label only)'
      x-access: owner
      x-lane: L3
      responses: { "200": { description: '{"ways_in": [{id, kind, label, added_at}]}' } }
    post:
      tags: [vault]
      summary: 'Add a way in (vault open). Body {"kind": "passphrase", "label": "...", "secret": "...", "pin" or "code"}; needs the current PIN or the recovery code (D29)'
      x-access: owner_device
      x-lane: L3
      requestBody: { $ref: "#/components/requestBodies/VaultWayIn" }
      responses: { "201": { description: '{id, kind, label}' }, "401": { description: 'No current PIN or recovery code, or a wrong one' } }
  /v1/vault/ways-in/{id}:
    delete:
      tags: [vault]
      summary: 'Remove a way in. Body {"pin" or "code"}: needs the current PIN or the recovery code (D29); refused if fewer than two would be left, and the recovery code is never removed (X3)'
      x-access: owner_device
      x-lane: L3
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody: { $ref: "#/components/requestBodies/VaultCurrentSecret" }
      responses: { "200": { description: '{"ok": true}' }, "401": { description: 'No current PIN or recovery code, or a wrong one' }, "409": { description: 'Refused (X3)' } }
  /v1/vault/inbox/file:
    post:
      tags: [vault]
      summary: 'File a waiting inbox box that would replace a key already saved under that name (vault open). Body {"name", "pin"}: floor-level (D29). A box never replaces a saved key without this'
      x-access: owner_device
      x-lane: L3
      requestBody: { $ref: "#/components/requestBodies/VaultInboxFile" }
      responses: { "200": { description: '{"replaced": true|false}' }, "401": { description: 'Wrong PIN' }, "423": { description: 'Locked' } }
  /v1/vault/secrets/{name}:
    put:
      tags: [vault]
      summary: 'Save a secret (write only). Body {"value", "unattended"?, "card_backed"?, "seal_if_locked"?}. 423 when locked unless seal_if_locked (then 202, sealed into the vault inbox, D36(a)). Never readable over HTTP'
      x-access: owner
      x-lane: L3
      parameters: [ { name: name, in: path, required: true, schema: { type: string, pattern: "^[A-Z][A-Z0-9_]{0,63}$" } } ]
      requestBody: { $ref: "#/components/requestBodies/VaultSecret" }
      responses: { "201": { description: '{"saved": true, "kept": "vault"}' }, "202": { description: '{"saved": false, "kept": "inbox"}' } }
    delete:
      tags: [vault]
      summary: 'Delete a secret; works while locked (off is one step)'
      x-access: owner
      x-lane: L3
      parameters: [ { name: name, in: path, required: true, schema: { type: string } } ]
      responses: { "200": { description: '{"ok": true}' } }
  /v1/vault/store/move:
    post:
      tags: [vault]
      summary: 'Move the vault to another zone1.vault-store (copy, read back, commit once)'
      x-access: owner_device
      x-lane: L3
      responses: { "501": { $ref: "#/components/responses/NotBuilt" } }
  /v1/vault/backup/now:
    post:
      tags: [vault]
      summary: 'Make a sealed backup now'
      x-access: owner
      x-lane: L3
      responses: { "501": { $ref: "#/components/responses/NotBuilt" } }
  /v1/vault/backup/list:
    post:
      tags: [vault]
      summary: 'List backups'
      x-access: owner
      x-lane: L3
      responses: { "501": { $ref: "#/components/responses/NotBuilt" } }
  /v1/vault/backup/restore:
    post:
      tags: [vault]
      summary: 'Restore a backup (asks the recovery code)'
      x-access: owner_device
      x-lane: L3
      responses: { "501": { $ref: "#/components/responses/NotBuilt" } }
  /v1/vault/backup/test:
    post:
      tags: [vault]
      summary: 'Check a backup opens'
      x-access: owner
      x-lane: L3
      responses: { "501": { $ref: "#/components/responses/NotBuilt" } }
  /v1/vault/hold:
    post:
      tags: [vault]
      summary: 'Write-only sealed box: hold(value, label, source_ref, expire_days) -> ref. Core only (Concierge, Archivist)'
      description: 'Listed because Z1V section 8 names it. The Core calls it in process; over HTTP it is refused for every caller.'
      x-access: core
      x-lane: L3
      responses: { "403": { $ref: "#/components/responses/Forbidden" } }

  /v1/bridge:
    get:
      tags: [bridge]
      summary: 'Open or closed, the per-host list'
      description: |
        Built by L4. The Bridge's posture: {"state": "open | closed", "damaged": bool, "version", "sha",
        "grants": [{"id", "subject", "host", "port", "subhosts", "phase", "lan"}], "switches": {subject: bool},
        "blocks": [{"pattern", "kind", "source"}], "note": the plain honest line, "cards": the last 20 cards}.
        A policy edited outside PuffPAI (its MAC under the machine key fails) reads "damaged" and closed.
      x-access: owner
      x-lane: L4
      responses:
        "200": { description: 'The posture, grants, switches, blocks and recent cards. Never a key or a value.' }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/bridge/open:
    post:
      tags: [bridge]
      summary: 'Open the Bridge'
      description: |
        Built by L4. Opens only what was granted on the owner's Yes cards. After an outside edit, opening
        starts from the last good copy (or an empty policy) and keeps the damaged file aside. With no machine
        key on this computer it stays closed and a card says why.
      x-access: owner
      x-lane: L4
      responses:
        "200": { description: 'The posture after the change (same shape as GET /v1/bridge, without note and cards).' }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/bridge/close:
    post:
      tags: [bridge]
      summary: 'Close the Bridge'
      description: 'Built by L4. Always works, even while Drawbridge is down (X18: narrowing never fails).'
      x-access: owner
      x-lane: L4
      responses:
        "200": { description: 'The posture after the change; state is "closed".' }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/bridge/ledger:
    get:
      tags: [bridge]
      summary: 'What went out (hosts, counts, codes; never values)'
      description: |
        Built by L4. The outside log, newest first: [{"t", "subject", "host", "port", "method", "via", "phase",
        "outcome", "code", "bytes_in", "bytes_out", "req_id"?, "rule"?}], plus {"event": "chain_restarted" |
        "chain_rotated"} lines. Never a path, a header, a body or a key.
      x-access: owner
      x-lane: L4
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 2000, default: 200 } }
      responses:
        "200": { description: 'The newest ledger lines.' }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/consent:
    get:
      tags: [consent]
      summary: 'Yes cards and what the owner answered'
      description: |
        Built by L4 (one store, lane L1's names). Every card, oldest first: {"consent_id", "scope", "floor",
        "card", "card_sha", "status", "factor", "by", "created_at", "answered_at", "covers", "bound", "expires",
        "title", "lines"}. "title" and "lines" are the card in plain words (consent.card_view), made only from
        the stored card, which card_sha covers: what it is, its hosts, keys, setup steps, the tools that change
        things, Drawbridge's notes and the files it could not check, and for a floor card that the PIN is needed.
        scope.kind tool_call (integration lane I1): one package tool call from chat outside her approved scope;
        the card shows the package, the tool and a gated summary of the arguments.
        status: pending | granted | declined | expired | revoked | damaged (a record edited outside PuffPAI).
      x-access: owner
      x-lane: L4
      parameters:
        - { name: status, in: query, schema: { enum: [pending, granted, declined, expired, revoked, damaged, void] } }
      responses:
        "200": { description: 'The cards (as above), plus "note" on a card the Core expired (a card left waiting when the Core stopped expires at the next start); void = a card row edited outside PuffPAI, which can never be answered. Never a PIN.' }
        "400": { description: 'An unknown status.' }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/consent/{id}:
    delete:
      tags: [consent]
      summary: 'Revoke a consent'
      description: 'Built by L4. Takes a Yes back; its grants stop at once. {"revoked": id}.'
      x-access: owner
      x-lane: L4
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        "200": { description: '{"revoked": "<consent_id>"}' }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: 'No such live Yes, or it was already taken back.' }
  /v1/consent/{id}/answer:
    post:
      tags: [consent]
      summary: 'The owner answers a Core Yes card (01 "Core API", 04 API table)'
      description: |
        Built by L4. The one way a Yes is given: the owner answering a Core card, from a paired device only
        (never an API key or a package token; the app's Origin and X-PuffPAI check applies to cookie callers).
        Body {"answer": "yes | no", "factor": "tap | pin | hello", "pin": "...", "card_sha": "..."}.
        A tap on a floor-level card is refused (D29); the PIN is checked by zone1.archivist.verify_pin (lane L3);
        Windows Hello is refused until it is built. card_sha is required on a Yes (400 no_card_sha without it,
        409 card_changed for another card's); a No is checked when it sends one. A No is always allowed.
        The PIN is never stored or echoed.
        No route lets a program grant on its own.
      x-access: owner_device
      x-lane: L4
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        "200": { description: 'The answered card (as in GET /v1/consent) plus "answer".' }
        "400": { description: '{"error", "code"}: the answer is not yes or no, the factor is unknown, or a Yes without card_sha (no_card_sha).' }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: '{"error", "code"}: a tap on a floor-level card (needs_pin), a wrong PIN (step_up_failed), Hello (hello_not_built), or not a paired device.' }
        "404": { description: '{"error", "code": "no_card"}' }
        "409": { description: '{"error", "code"}: already answered, expired, the card changed (card_changed), or a card row edited outside PuffPAI (void).' }
        "503": { description: '{"error", "code"}: no PIN check yet (no_pin_check), or no machine key (no_machine_key).' }
  /v1/audit:
    get:
      tags: [audit]
      summary: 'The audit log, read only (names and codes, never values)'
      description: 'Built by L4. {"chain_ok": bool, "bad_line": int, "lines": [newest first]}. The log is a hash chain with a sealed head.'
      x-access: owner
      x-lane: L4
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 2000, default: 200 } }
      responses:
        "200": { description: 'Whether the chain is whole, and the newest lines.' }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/checklist:
    get:
      tags: [checklist]
      summary: 'Open "Your turn" steps (a package token sees its own only)'
      description: 'Query all=1 adds closed steps. Majordomo keeps the list in checklist.json.'
      x-access: package_ok
      x-lane: L5
      parameters:
        - { name: all, in: query, schema: { type: string } }
      responses:
        "200":
          description: 'Steps, oldest first, each with state open | done | skipped.'
    post:
      tags: [checklist]
      summary: 'Raise a step (the one step shape; package and blocks filled in by the Core)'
      description: 'A package token raises steps for itself only. An owner caller may name the package or agent it is for in "package" (default "core"). Over HTTP no caller may raise admin true or a command check (D49): admin steps come only from the Core in process (setup_steps approved on the package''s Yes, or Toolsmith and the other agents). A package''s url check may reach only http://127.0.0.1:<its own port>/, and its file check only packages/<id>, its linked folder and data/<id>. The stored step gets a random id (step_...), asked_id (the id sent) and raised_by (pkg:<id>, owner, setup_steps:<id> or the agent). 201 with the stored step; 400 with the plain reason.'
      x-access: package_ok
      x-lane: L5
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Step" }
      responses:
        "201": { description: 'The stored step.' }
        "400": { description: 'Not the one step shape.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/checklist/{id}:
    get:
      tags: [checklist]
      summary: 'One step (added by lane L5, so a waiting package can read its own step)'
      x-access: package_ok
      x-lane: L5
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        "200": { description: 'The step.' }
        "404": { description: 'No such step.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/checklist/{id}/done:
    post:
      tags: [checklist]
      summary: 'Mark a step done (its check runs when it has one)'
      description: '200 with the step when done; 409 with the plain reason when its check does not pass yet (the step stays open).'
      x-access: package_ok
      x-lane: L5
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        "200": { description: 'Done.' }
        "409": { description: 'The check did not pass.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/checklist/{id}/skip:
    post:
      tags: [checklist]
      summary: 'Skip a step'
      x-access: package_ok
      x-lane: L5
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        "200": { description: 'Skipped.' }
  /v1/checklist/{id}/run-admin:
    post:
      tags: [checklist]
      summary: 'Run a step''s PowerShell command as administrator: one Windows UAC prompt she answers (added by lane L5, 03 3.5)'
      description: 'Only for an open run_command step with admin true and shell powershell, raised by the Core (never by a package), on Windows, from a paired device. Body {"factor": "pin", "pin": "..."}: the PIN is needed in this same request (D29); 403 without it or when it is wrong, 501 (lane L3) while the PIN check is not built, and for factor hello. The command is the stored step''s own text, read again after the PIN, the one shown on the card. Reply 200 once the UAC prompt is started; she presses Done after it ran.'
      x-access: owner_device
      x-lane: L5
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        "200": { description: 'The UAC prompt was started.' }
        "400": { description: 'Not an admin PowerShell step, or not Windows.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: 'No PIN, or a wrong PIN.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "501": { description: 'The PIN check (lane L3) or Windows Hello is not built yet; reason says so.' }
  /v1/events:
    get:
      tags: [events]
      summary: 'Event stream, filtered by the caller''s audience and grants (contracts/events.json)'
      description: |
        Server-sent events. Each event has "id: <seq>", "event: <type>" and "data: <the Bus message JSON>".
        Resume with the Last-Event-ID header or ?after=<seq>. The stream ends after ?timeout=<s>
        (default 25, at most 60; 0 sends what is buffered and ends), and EventSource reconnects.
        An owner sees what is visible to "ui"; a package token sees what is visible to "package",
        and checklist.changed only for its own steps.
      x-access: package_ok
      x-lane: L5
      parameters:
        - { name: after, in: query, schema: { type: integer } }
        - { name: timeout, in: query, schema: { type: integer } }
      responses:
        "200": { description: 'text/event-stream' }
  /v1/tools/servers:
    get:
      tags: [tool_servers]
      summary: 'The outside MCP tool servers the owner added, never a password'
      description: 'Built by api-tools (D137). Reply {"servers": [{"id", "name", "url", "kind": "http", "address", "where": "here" | "lan" | "internet", "where_said", "has_password", "added_at", "added_by": "owner" | "chat", "tools": [{"name", "description"}], "tool_count", "state": "ready" | "waiting", "line"}], "vault"}.'
      x-access: owner
      x-lane: api-tools
      responses:
        "200": { description: 'The rows.' }
    post:
      tags: [tool_servers]
      summary: 'Add one outside MCP tool server by its web address'
      description: 'Built by api-tools (D137). Body {"name", "address", "password"?}. http(s) only; no user name or password inside, no ? or # part. On this computer (127.0.0.1, localhost, ::1) it connects first (list_tools) and is kept only if it answers. Anywhere else it is saved "waiting" and the Bridge address card (D110) is raised for package outside-<id>; the reply carries {"consent_id", "card_sha", "title", "lines"}. A password goes to the vault as tool_server.<id>, never to the record or a reply; the vault must be open. A password in the query string is refused.'
      x-access: owner_device
      x-lane: api-tools
      responses:
        "200": { description: 'Added, with its tools.' }
        "202": { description: 'Waiting for her Yes on the Bridge; its card is in the reply.' }
        "400": { description: 'Refused, one plain line. Nothing kept.' }
        "409": { description: 'Same name, a name in use, or the vault is not open for its password.' }
        "502": { description: 'It did not answer. Nothing kept.' }
        "503": { description: 'No card could be raised.' }
  /v1/tools/servers/{server_id}:
    delete:
      tags: [tool_servers]
      summary: 'Remove one: its record, its password in the vault, its address Yes and grant'
      description: 'Built by api-tools (D137). Reply {"deleted": true, "line"}.'
      x-access: owner_device
      x-lane: api-tools
      parameters:
        - { name: server_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: 'Removed.' }
        "404": { description: 'No such server.' }
        "423": { description: 'It has a password and the vault is locked. Nothing removed.' }
  /v1/tools/servers/{server_id}/refresh:
    post:
      tags: [tool_servers]
      summary: 'Ask it for its tools again; off this computer only after her Yes'
      description: 'Built by api-tools (D137). Reply {"server", "state", "line"}; while waiting, its address card again.'
      x-access: owner_device
      x-lane: api-tools
      parameters:
        - { name: server_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: 'Ready, with its tools.' }
        "202": { description: 'Still waiting for her Yes; the card is in the reply.' }
        "404": { description: 'No such server.' }
        "409": { description: 'The Bridge refused (closed, or no live grant). Nothing sent.' }
        "423": { description: 'Its password needs the vault open.' }
        "502": { description: 'It did not answer.' }

  /v1/toolsmith:
    get:
      tags: [toolsmith]
      summary: 'Toolsmith now: its model (local, or a frontier provider with the cap), and the builds with each job''s status'
      x-access: owner
      x-lane: L6
      description: 'Each build also carries library (lane I19b), its knowledge fetch: null when its plan reads none, else {state: waiting|fetching|done, done, of, up_to, sources: [names], now, line}. done counts what is in the library; of is what was found to read, or with up_to true the plan''s cap while it still searches.'
      responses: { "200": { description: '{where, provider?, model?, company?, cost_cap_usd?, consent_changed? (D118: only when her saved Yes is for an earlier sentence, why it asks again), builds: [{id, goal, created_at, jobs: [{id, name, status}], library}]}' } }
  /v1/toolsmith/providers:
    get:
      tags: [toolsmith]
      summary: 'The zone3.toolsmith-model providers (wizard step 5): company, hosts, models and prices, the consent sentence and its sha, the key name. Never a key.'
      x-access: owner
      x-lane: L6
      responses: { "200": { description: 'A list of providers.' } }
  /v1/toolsmith/model:
    put:
      tags: [toolsmith]
      summary: 'The owner picks Toolsmith''s model: {"where": "local"} or {"where": "cloud", provider, model, cost_cap_usd, consent_sha} (the sha of the consent sentence she read and said yes to, D35). Default cap $5 per build (D43).'
      x-access: owner_device
      x-lane: L6
      responses:
        "200": { description: 'The saved choice.' }
        "400": { description: 'Not a provider, model or consent sentence the Core knows.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/toolsmith/plan:
    post:
      tags: [toolsmith]
      summary: 'Goal (and the jobs from the goal step) -> the plan: per job the package reused or the apps to try (with "Not used" reasons), ONE setup list, the knowledge leg (topics the local brain picked, the hosts read after the Yes, Kiwix and Data.gov offered only), and ONE Yes card asked on the Core consent cards (scope = the plan sha)'
      description: 'Body {goal, jobs: [{name, does, sample_ask, pasted: [github urls]}]}. 201 with the build. No company model is asked before the Yes.'
      x-access: owner
      x-lane: L6
      responses:
        "201": { description: 'The build with its plan, card and consent id.' }
        "400": { description: 'No goal and no jobs.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/toolsmith/builds/{build_id}:
    get:
      tags: [toolsmith]
      summary: 'One build: plan, Yes, cost so far, and each job''s live status (planned, waiting_yes, waiting_you, waiting_vault, held, building: <app>, working, not_yet, nothing_found)'
      x-access: owner
      x-lane: L6
      parameters: [ { name: build_id, in: path, required: true, schema: { type: string } } ]
      responses:
        "200": { description: 'The build.' }
        "404": { description: 'No such build.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/toolsmith/builds/{build_id}/start:
    post:
      tags: [toolsmith]
      summary: 'Start the build after the owner''s Yes. Body {consent_id}; runs only when that consent is a yes for exactly this plan sha.'
      description: 'Lane I16: safe to call more than once, from any path (the Desktop, the chat, the wizard). When the plan has ticked PuffPAI store apps not on the bot yet, the Core adds them first (it also begins this when the plan card is granted): each gets its own Package Manager Yes card, and the Core waits until each card is answered and each install has a final status (never "installing"; "broken" is not added). This call then starts nothing, and the Core starts the build itself when the adds are done. The progress is the build''s "store_adds": {consent_id, state: adding | done, apps: [{package, name, job_name, state: waiting | asking | installing | added | not_added, card, line}], line, said: [every line in order]}, in GET /v1/toolsmith/builds/{build_id}.'
      x-access: owner
      x-lane: L6
      parameters: [ { name: build_id, in: path, required: true, schema: { type: string } } ]
      responses:
        "200": { description: 'The build: running (yes set), or still adding its ticked store apps (store_adds.state adding; the Core starts it after).' }
        "404": { description: 'No such build.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'No Yes for this plan yet (plain reason).', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/toolsmith/builds/{build_id}/again:
    post:
      tags: [toolsmith]
      summary: '"Check again" (lane I18e): try the build''s unfinished jobs once more (held, not_yet, nothing_found). Jobs that work stay as they are; each job tried again starts its tries over, with her hold-card answers kept. Body {consent_id?}.'
      description: 'Her Yes is reused only when the same plan sha has its Yes still live (not taken back, not past its end) for exactly this plan, and Toolsmith''s model and cost cap are what that card said. Otherwise ONE new Yes card is raised the normal way (kind package, this build''s target, bound to the plan sha) and the build''s "again" record says {consent_id, jobs, state: asking}; it covers only the jobs tried again and their install hosts from the plan, and the cost cap counts what the build spent already. POST again with that consent_id (or POST start with it, as the Desktop does after a plan card Yes) to start. When it starts, "again".state is started and that Yes is the build''s Yes.'
      x-access: owner
      x-lane: I18e
      parameters: [ { name: build_id, in: path, required: true, schema: { type: string } } ]
      responses:
        "200": { description: 'The build: its jobs tried again (planned, then building), or its "again" card waiting.' }
        "404": { description: 'No such build.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'Plain reason: Toolsmith is already working on it, safe mode (safe_mode true), the vault is locked and the cloud model needs its key ("Unlock your vault first."), no Yes yet, nothing left to check again, or a Yes that is not for this.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/toolsmith/builds/{build_id}/use:
    put:
      tags: [toolsmith]
      summary: 'Her ticks on the plan card''s offers, before her Yes (lane I4b): {consent_id, use: [job numbers]}. An offer is an installed app one of the brain''s two asks picked; a ticked job reuses it at the Yes, an unticked one searches. Only offers the card shows; refused after the Yes.'
      x-access: owner_device
      x-lane: L6
      parameters: [ { name: build_id, in: path, required: true, schema: { type: string } } ]
      responses:
        "200": { description: 'Recorded: {ok, use: {job id: package id}}.' }
        "400": { description: 'Not an offer on the card.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: 'No such build.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'Not this plan''s card, or the plan has its Yes already.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/toolsmith/builds/{build_id}/holds/{consent_id}:
    put:
      tags: [toolsmith]
      summary: 'Her ticks on a job''s hold card (lane I4b): {try: [candidate refs]}, which apps Drawbridge couldn''t fully check Toolsmith may try. Only while the card waits; only ticked apps are tried, and a Yes with no ticks recorded tries none.'
      x-access: owner_device
      x-lane: L6
      parameters: [ { name: build_id, in: path, required: true, schema: { type: string } }, { name: consent_id, in: path, required: true, schema: { type: string } } ]
      responses:
        "200": { description: 'Recorded: {ok, ticked}.' }
        "400": { description: 'Not an app on the card.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'Not one of this build''s hold cards, or already answered.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/toolsmith/jobs/{job_id}:
    get:
      tags: [toolsmith]
      summary: 'One job: its candidates, what was tried and why it stopped, its result and proof'
      x-access: owner
      x-lane: L6
      parameters: [ { name: job_id, in: path, required: true, schema: { type: string } } ]
      responses:
        "200": { description: 'The job.' }
        "404": { description: 'No such job.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/toolsmith/jobs/{job_id}/next:
    post:
      tags: [toolsmith]
      summary: '"Try next app": end the current try cleanly and move to the next candidate'
      x-access: owner
      x-lane: L6
      parameters: [ { name: job_id, in: path, required: true, schema: { type: string } } ]
      responses:
        "200": { description: 'Asked.' }
        "404": { description: 'No such job.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/toolsmith/agent/build:
    get:
      tags: [toolsmith]
      summary: 'Toolsmith reads its own build: goal, jobs and plan, whether it has the Yes, its budgets and timing, its model choice (never a key), the shell the Core runs, search_places (the hosts it may ask right now, read with no line in the outside log; can''t tell: none) and web_ready (the web rows that are on: her Yes, the search on, the vault lends the key)'
      x-access: toolsmith
      x-lane: L6
