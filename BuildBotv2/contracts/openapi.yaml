      responses:
        "200": { description: 'The answer.' }
        "400": { description: 'A plain reason.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/packages/{id}/send:
    post:
      tags: [knowledge]
      summary: 'Send one file to a package that takes files'
      description: 'Body {"file_name", "content_b64"} or {"path"}, a pinned file or one inside a linked folder and no other. Reply {"line"}. 400 or 409 {"error"}.'
      x-access: owner_device
      x-lane: D127
      responses:
        "200": { description: 'The answer.' }
        "400": { description: 'A plain reason.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/settings/edits:
    get:
      tags: [settings]
      summary: 'May the bot change her documents? Off until she turns it on'
      description: 'D140. Reply {"on": false}.'
      x-access: owner
      x-lane: D140
      responses:
        "200": { description: 'The setting.' }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [settings]
      summary: 'Turn changing her documents on or off'
      description: 'D140. Body {"on": true}. Reply {"on"}. On also lets such a tool put her real private details in the file. One audit line per change (the setting only). If that line can''t be written it does not turn on (503); off always works.'
      x-access: owner_device
      x-lane: D140
      responses:
        "200": { description: 'The setting.' }
        "400": { description: 'A plain reason.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { description: 'The audit line could not be written, so it stays off.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/settings/move:
    get:
      tags: [settings]
      summary: 'What does not travel when a bot moves to another computer'
      description: 'D141. Reply {"stays": ["..."]}.'
      x-access: owner
      x-lane: D141
      responses:
        "200": { description: 'The lines.' }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/settings/move/export:
    post:
      tags: [settings]
      summary: 'Export this bot to a folder that can go in a git repo'
      description: 'D141. Body {"path"}. Everything is scanned first; a private detail in the record writes nothing, and one in an app leaves that app out. Reply {"folder", "apps", "left_out", "stays"}.'
      x-access: owner_device
      x-lane: D141
      responses:
        "200": { description: 'Written.' }
        "400": { description: 'A plain reason. Nothing was written.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/settings/move/check:
    post:
      tags: [settings]
      summary: 'Check a moved bot, every hash, and say what it holds. Nothing changes'
      description: 'D141. Body {"path"}. Reply {"name", "apps", "not_here", "left_out", "books", "linked", "pinned", "added", "stays"}.'
      x-access: owner_device
      x-lane: D141
      responses:
        "200": { description: 'What it holds.' }
        "400": { description: 'A plain reason.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/settings/move/import:
    post:
      tags: [settings]
      summary: 'Bring in its name, look, who the bot is and Home. Each app is then added with its own Yes'
      description: 'D141. Body {"path"}. Reply: as /check, with "said", and each app with the source for POST /v1/packages.'
      x-access: owner_device
      x-lane: D141
      responses:
        "200": { description: 'Brought in.' }
        "400": { description: 'A plain reason. Nothing was changed.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/knowledge/place:
    get:
      tags: [knowledge]
      summary: 'Where her books and downloads are kept, how much room is there, and how a move goes'
      description: |
        D103. Reply {"where", "store", "default", "drive", "there", "free_bytes", "free", "line", "warning", "move"}.
        "line" is the one plain line when the drive is gone or full, else "". "move" is null, or {"phase":
        "copying | switching | cleaning | stopped | done", "running", "from", "to", "done_files", "total_files",
        "done_bytes", "total_bytes", "percent", "now", "line", "can_resume", "can_cancel", "switched", "left"}.
      x-access: owner
      x-lane: D103
      responses:
        "200": { description: 'Where they are.' }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [knowledge]
      summary: 'Move her books and downloads to another folder or drive, in the background'
      description: |
        D103. Body {"path": "<a folder>", "leave_old": false}. "path" "" is back to the data folder. The folder goes
        through the one check first (zone1.knowledge_folder.problem). An interrupted move loses nothing. "leave_old"
        uses the new place and leaves what is at the old one there, for an old drive that is gone for good. Reply:
        the same view as the GET. 400 {"error", "code"}: the folder can't be used. 409 {"error", "code"}: "running",
        "unfinished", "source_away", "downloading".
      x-access: owner_device
      x-lane: D103
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string }
                leave_old: { type: boolean }
      responses:
        "202": { description: 'The move runs.' }
        "400": { description: 'That folder can''t be used, with the plain line.' }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: 'Not now, with the plain line.' }
  /v1/knowledge/place/resume:
    post:
      tags: [knowledge]
      summary: 'Pick a stopped move up again, where it stopped'
      description: 'D103. Reply: the view of GET /v1/knowledge/place. 409 when no move is waiting or one is running.'
      x-access: owner_device
      x-lane: D103
      responses:
        "202": { description: 'The move runs again.' }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: 'Nothing to pick up, with the plain line.' }
  /v1/knowledge/place/cancel:
    post:
      tags: [knowledge]
      summary: 'Stop a move and put everything back, until it has switched to the new place'
      description: 'D103. Takes back only what the move itself put in the new place. Reply: the view of GET /v1/knowledge/place. 409 when no move is waiting or the new place is in use already.'
      x-access: owner_device
      x-lane: D103
      responses:
        "200": { description: 'Cancelled.' }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: 'Not now, with the plain line.' }
  /v1/settings:
    get:
      tags: [settings]
      summary: 'Active Desktop, avatar, Bridge posture'
      description: 'Reply {"ui": "<id>", "avatar": {"id", "name", "preview"} or null, "bridge": "open | closed | not_set", "wizard_complete": bool, "pages": "http://127.0.0.1:8422", "bot": {"name", "theme"}, "opens": "window | chat | dashboard"}. bot is the bot''s own name and look (lane I10c, settings\bot.json), "Puff" and "clean" until she picks (D90; a bot whose setup finished with no look saved reads "puff"). opens is what opens when BuildBot starts (D94, settings\opens.json), "window" until she picks (D81). preview is a /pkg/<id>/<file> path on the pages address ("pages", D49) or null.'
      x-access: owner
      x-lane: L5
      responses:
        "200": { description: 'The settings.' }
  /v1/settings/ui:
    put:
      tags: [settings]
      summary: 'Pick the active ui package'
      description: 'Body {"id": "<ui package id>"}. 400 if no installed or built-in ui package has that id.'
      x-access: owner
      x-lane: L5
      responses:
        "200": { description: 'The new settings.' }
        "400": { description: 'Not a ui package.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/settings/avatar:
    put:
      tags: [settings]
      summary: 'Pick the active avatar package (not named in the docs; 01 says settings holds the avatar)'
      description: 'Body {"id": "<avatar package id>"}, or {"id": null} for none.'
      x-access: owner
      x-lane: L5
      responses:
        "200": { description: 'The new settings.' }
        "400": { description: 'Not an avatar package.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/settings/bot:
    put:
      tags: [settings]
      summary: 'Name the bot or pick its look (added by lane I10c; the wizard''s two steps save through the same code)'
      description: 'Body {"name"?, "theme"?}, one or both, never null. name: 1 to 40 characters of plain text, trimmed, with at least one letter, number, symbol or emoji you can see, no control or hidden characters (blank fillers too), no markup, no link. theme: an id from GET /v1/settings/themes. Saved in settings\bot.json. Reply: the settings, as GET /v1/settings.'
      x-access: owner_device
      x-lane: I10c
      responses:
        "200": { description: 'The new settings.' }
        "400": { description: 'A name or look that can''t be used, in plain words.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/settings/opens:
    put:
      tags: [settings]
      summary: 'Pick what opens when BuildBot starts: the PuffPAI window, the chat in a terminal or the dashboard (added for D94, D81)'
      description: 'Body {"opens": "window"}, {"opens": "chat"} or {"opens": "dashboard"}. Saved in settings\opens.json; Start BuildBot.cmd (puffpai start) reads it, and puffpai start --opens saves it too. A missing or broken file reads as "window". Reply: the settings, as GET /v1/settings.'
      x-access: owner
      x-lane: cli-default
      responses:
        "200": { description: 'The new settings.' }
        "400": { description: 'Not chat or dashboard, in plain words.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/window/open:
    post:
      tags: [settings]
      summary: 'Open the PuffPAI window from the dashboard (D81, the owner 10-30)'
      description: 'Starts this bot''s own window as its own process and returns at once. One window per bot: a second open brings the first one forward. It takes nothing from the request. Only a paired-device token: her paired browsers, and this computer''s terminal key, which is one by design. The window always shows PuffPAI''s own page, whatever Desktop is active (D108). A window already starting is left to start, so repeated calls start one. Reply {"ok": bool, "line": "<one plain line>"}; a computer that can''t show the window (no WebView2, no pywebview) is ok false with its line, not an error.'
      x-access: owner_device
      x-lane: window
      responses:
        "200": { description: 'Whether it opened, in one plain line.' }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/terminal/open:
    post:
      tags: [settings]
      summary: 'Open the real terminal chat from the window''s switch (D115)'
      description: 'Starts this bot''s own terminal chat in a console window of its own and returns at once, in the chat named by the body {"conversation": "<id>"} (optional, "main" when left out). It takes nothing else from the request: an id that is not letters, digits, - and _ is a 400, never a command, a path or a folder. Only a paired-device token, as /v1/window/open. Two presses in one chat within 3 seconds open one; another chat opens its own. Reply {"ok": bool, "line": "<one plain line>"}; a computer that can''t open one here is ok false with its line, not an error. Safe mode: a 409, and no console starts, as /v1/dev/shell.'
      x-access: owner_device
      x-lane: window-switch
      responses:
        "200": { description: 'Whether it opened, in one plain line.' }
        "400": { description: 'Not a chat''s id.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: 'Safe mode: {"error", "code": "safe_mode"}.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/settings/drawbridge:
    get:
      tags: [settings]
      summary: 'The owner''s setting for files Drawbridge can''t read (added for D95)'
      description: 'Reply {"files": "normal | locked", "title", "choices": [{"id", "name", "line", "on"}]}. Kept in settings\drawbridge.json. A missing file reads as "normal" (the default); a broken file or any other value reads as "locked".'
      x-access: owner
      x-lane: i23a
      responses:
        "200": { description: 'The setting and both choices in plain words.' }
    put:
      tags: [settings]
      summary: 'Change it: Normal or Locked down (D95)'
      description: 'Body {"files": "normal"} or {"files": "locked"}. Only the owner at a paired device; the terminal key this computer''s CLI uses is refused (403), as are owner API keys, package and Toolsmith tokens. One audit line per change (the two setting names only); no event carries it. If the audit line can''t be written, the change is undone (503). Reply: as GET.'
      x-access: owner_device
      x-lane: i23a
      responses:
        "200": { description: 'The setting now.' }
        "400": { description: 'Not normal or locked, in plain words.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: 'Not the owner at a paired device.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: 'The audit line could not be written; nothing changed.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/settings/themes:
    get:
      tags: [settings]
      summary: 'The looks this bot has (added by lane I10c)'
      description: 'Reply [{"id", "name", "mode": "night | day | both", "line", "tokens": {"--token-name": "value"}}]. The token names are the Desktop''s own (desktop.css). A "both" look follows the Desktop''s day and night switch: tokens is its night palette and day_tokens its day palette. line is one plain sentence about it.'
      x-access: owner
      x-lane: I10c
      responses:
        "200": { description: 'The looks.' }
  /v1/settings/layout:
    get:
      tags: [settings]
      summary: 'How the owner arranged her Home page (added by lane I8b; harvested from v1 dashboard_widgets.py get_layout, 06 "Desktop layout")'
      description: 'Reply {"version": 1, "tiles": {"order", "hidden", "pinned", "names"}, "seen": {"tiles": {id: name}}, "apps": {"view": "tiles | pages", "pages": [package id]}, "updated_at", "updated_by"}. Kept in data\desktop\layout.json; a missing or broken file gives the defaults. Tile ids are the Desktop''s own: its core tiles (apps, running, building, your-turn, bridge, brain), <package id>:<widget id>, and app/<package id> for an app whose own page is on Home (D82).'
      x-access: owner
      x-lane: I8b
      responses:
        "200": { description: 'The layout.' }
    put:
      tags: [settings]
      summary: 'Save the layout (v1 save_layout): each section given (tiles, seen, apps) replaces the saved one'
      x-access: owner
      x-lane: I8b
      responses:
        "200": { description: 'The saved layout.' }
        "400": { description: 'Not an object.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/settings/layout/arrange:
    post:
      tags: [settings]
      summary: 'One change to Home (v1 arrange): pin, unpin, hide, show, move or rename one tile; put an app''s own page on Home or take it off; apps as tiles or pages (D82)'
      description: 'Body {"action", "tile": "<id or her name for it>", "position": "first | last | <number from 1>", "name"}. D82 (PROPOSED): {"action": "add_app | remove_app", "app": "<installed package id>"} puts that app''s own page on Home as the tile app/<id> (first), or takes it off; {"action": "apps_as", "view": "tiles | pages"} shows every app as its own page tile, or only as small tiles in Your apps. Reply {"ok", "line", "id", "name", "layout"}.'
      x-access: owner
      x-lane: I8b
      responses:
        "200": { description: 'Done, with one plain line.' }
        "400": { description: 'Not done: {"ok": false, "line"}.' }
  /v1/settings/persona:
    get:
      tags: [settings]
      summary: 'Who your bot is: the role written from her goal at the end of the plan step (added by lane I12)'
      description: 'Reply {"text", "source": "brain | owner | none", "build", "goal_sha", "built_with": "local | <company>:<model> | empty", "written_at", "role", "knows": [..], "first_question", "flag", "in_use": "persona | plain default | none", "max_chars": 4000}. Kept in settings\persona.json. text is "" until it is written. flag is "" or why Drawbridge''s screen for owner text (text_rules.owner_text_flag) would not use it; then in_use is "plain default" and the chat uses a plain role instead. The chat puts the role at the top of its system message, ahead of the tool and safety rules, which stay last and win.'
      x-access: owner_device
      x-lane: I12
      responses:
        "200": { description: 'The persona.' }
    put:
      tags: [settings]
      summary: 'Her own words for who the bot is (added by lane I12)'
      description: 'Body {"text"}: plain text, 1 to 4000 characters, no control or hidden characters (tabs and line breaks allowed). Reply: the same as GET; source becomes "owner". Text her screen flags is kept but not used (see flag).'
      x-access: owner_device
      x-lane: I12
      responses:
        "200": { description: 'Saved.' }
        "400": { description: 'Not plain text, empty or too long.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/settings/persona/redo:
    post:
      tags: [settings]
      summary: 'Write who the bot is again from her goal (added by lane I12)'
      description: 'Always on this computer''s brain, even when Toolsmith uses a cloud company: nothing is sent (D66). Replaces her own words. No body. Reply: the same as GET.'
      x-access: owner_device
      x-lane: I12
      responses:
        "200": { description: 'Written again.' }
        "409": { description: 'No goal yet, no Toolsmith, or the brain gave nothing usable (the reason in plain words).', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/settings/you:
    get:
      tags: [settings]
      summary: 'What she tells her bot about herself (added by lane I12)'
      description: 'Reply {"name", "call_me", "about", "timezone"}; each is "" until she answers. Kept as one held vault item (label owner.you, P3); settings\you.json keeps only its ref. The chat uses call_me in greetings and about as her own words, only for the brain on this computer, only while the vault is open, and only when the chat caller is her paired device (never an owner API key). The reply also has "flag": {"call_me", "about"}, each "" or why Drawbridge''s screen for owner text keeps that value out of the brain (it is still saved).'
      x-access: owner_device
      x-lane: I12
      responses:
        "200": { description: 'Her answers.' }
        "423": { description: 'The vault is locked and something is kept: never an empty form ({"error", "code": "locked"}).', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    put:
      tags: [settings]
      summary: 'Save what she tells her bot about herself (added by lane I12)'
      description: 'Body {"name", "call_me", "about", "timezone"}: name and call_me 1 to 40 characters each, about at most 1000, timezone an IANA name (like America/Chicago) or "". Plain text only; other fields are refused. While the vault is locked it is sealed into the vault inbox and filed at the next unlock. Plain text means no control or hidden characters (variation selectors, blank fillers and tag characters included). Reply {"name", "call_me", "about", "timezone", "kept": "vault | inbox", "flag": {"call_me", "about"}}.'
      x-access: owner_device
      x-lane: I12
      responses:
        "200": { description: 'Kept.' }
        "400": { description: 'A field is missing, too long, not plain text, or not a time zone.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'No vault here, or not set up yet.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/notify:
    post:
      tags: [notify]
      summary: 'A package asks the Core to tell the owner something. Body {title, text, sound, speak, urgency} (05)'
      description: 'title is required (at most 120 characters), text at most 600, urgency low | normal | high. sound and speak are kept for UIs that can use them (voice is not in this week''s build). Reply 201 {"id"}.'
      x-access: package_ok
      x-lane: L5
      responses:
        "201": { description: 'Posted.' }
        "400": { description: 'Bad body.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    get:
      tags: [notify]
      summary: 'Notices not yet dismissed, newest first (added by lane L5, so a UI can read what was posted)'
      x-access: owner
      x-lane: L5
      responses:
        "200": { description: 'Notices.' }
  /v1/notify/{id}:
    delete:
      tags: [notify]
      summary: 'Dismiss a notice (added by lane L5)'
      x-access: owner
      x-lane: L5
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        "200": { description: 'Dismissed.' }
        "404": { description: 'No such notice.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/theme:
    get:
      tags: [theme]
      summary: 'Look tokens so package pages match the Desktop'
      description: 'Reply {"name", "colors", "fonts", "radius", "css"}; css is a ":root { ... }" block of custom properties. The active ui package may ship theme.json; settings/theme.json overrides single tokens.'
      x-access: package_ok
      x-lane: L5
      responses:
        "200": { description: 'Theme tokens.' }
  /v1/people:
    get:
      tags: [people]
      summary: 'The shared people list (D12): id, name, emoji, adult | child'
      description: 'A package token may read it (02 PUFFPAI_TOKEN, D48); only the owner changes it (PUT).'
      x-access: package_ok
      x-lane: L5
      responses:
        "200": { description: 'People, as [{id, name, emoji, role}].' }
    put:
      tags: [people]
      summary: 'Replace the people list (added by lane L5 for "GET and edit", D12; the people page is not in this week''s build)'
      description: 'Body [{id, name, emoji, role}]; role is adult or child; ids unique.'
      x-access: owner
      x-lane: L5
      responses:
        "200": { description: 'The stored list.' }
        "400": { description: 'Bad list.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/pair:
    post:
      tags: [ui]
      summary: 'Trade a one-time pairing code for the paired-device cookie (added by lane L5)'
      description: |
        Body {"code": "..."}. The code comes from `puffpai pair` on this computer; it works once,
        for 10 minutes. 200 sets the puffpai_device cookie (puffpai_device_<port> when the Core is not on 8420, D129; HttpOnly, SameSite=Strict, host-only) for a
        new paired device and answers {"ok": true, "device_key": "ppb_..."}: the second half of the
        login, shown once, which the Desktop keeps in localStorage and sends as X-PuffPAI-Device
        (D79); 401 for a wrong, used or old code. Only at puffpai.localhost:<port>; on any
        other Host it answers 403 and the code is not used (D79). On the home network (D130) it answers too, with the
        cookie named puffpai_device_<port>, on the address that device uses, and 429 after too many wrong codes.
      x-access: public
      x-lane: L5
      security: []
      responses:
        "200": { description: 'Paired.' }
        "401": { description: 'Wrong, used or old code (code "pair_code").', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: 'Not at puffpai.localhost:<port>; the code is not used (D79).', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: 'On the home network only: too many wrong codes (code "pair_wait").', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /pair:
    get:
      tags: [ui]
      summary: 'The pair screen on the home network (D130)'
      description: |
        Only on the home network's listener: a plain page where a device types a code. It holds no secret. On this
        computer there is no such route (404).
      x-access: public
      x-lane: D130
      security: []
      responses:
        "200": { description: 'text/html' }
        "404": { description: 'On this computer.' }
  /v1/network:
    get:
      tags: [network]
      summary: 'Is this bot on the home network, and the addresses to type (D130)'
      x-access: owner_device
      x-lane: D130
      responses:
        "200": { description: '{"on": bool, "open": bool, "port": int, "line": "", "urls": ["http://..."], "worth_knowing": "..."}' }
    put:
      tags: [network]
      summary: 'Turn the home network off or on, at once (D130).'
      description: |
        Body {"on": true} or {"on": false}. Saved in the bot's settings\network.json, and writes one audit line. Off closes
        every socket of it. From a paired device on the network too: it answers first, then closes.
      x-access: owner_device
      x-lane: D130
      responses:
        "200": { description: 'The same answer as GET.' }
        "400": { description: 'Not {"on": true} or {"on": false}.' }
        "503": { description: 'The audit line could not be written, so it did not start listening.' }
  /v1/network/code:
    post:
      tags: [network]
      summary: 'A pairing code to type on another device (D130)'
      x-access: owner_device
      x-lane: D130
      responses:
        "200": { description: '{"code": "XXXX-XXXX-XXXX", "minutes": 10, "urls": [...]}. One use.' }
  /v1/network/pages:
    get:
      tags: [network]
      summary: 'On the home network: each package page port, and its page pass as a cookie (D130)'
      description: |
        Needs both halves. Opens the page listeners, answers {"ports": {"<id>": <port>}} and sets one HttpOnly, host-only
        cookie per port, puffpai_page_<port>, for that one package, for 12 hours, signed with this device's binding. Never
        forwarded to a package. Adopted apps have no port. 404 on this computer.
      x-access: owner_device
      x-lane: D130
      responses:
        "200": { description: 'The ports.' }
        "404": { description: 'On this computer.' }
  /v1/devices:
    get:
      tags: [network]
      summary: 'Every paired browser (D130)'
      x-access: owner_device
      x-lane: D130
      responses:
        "200": { description: '{"devices": [{"id": "<16 hex>", "label": "...", "created_at": "...", "this": bool}]}' }
  /v1/devices/{id}:
    delete:
      tags: [network]
      summary: 'Remove one paired browser. It stops on its very next request (D130)'
      x-access: owner_device
      x-lane: D130
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: '{"removed": "<id>"}' }
        "404": { description: 'Not paired.' }
  /v1/signin:
    get:
      tags: [ui]
      summary: 'Where the owner signs a browser in: Sign in a browser.cmd and its folder (D92)'
      description: |
        {"file": "Sign in a browser.cmd", "folder": "<the install folder>"} when install.ps1 wrote that
        file next to Start BuildBot.cmd, else both empty (run from source). Not secret: the Desktop's
        sign-in screen names them. Only at puffpai.localhost:<port>, like /v1/recover.
      x-access: public
      x-lane: L5
      security: []
      responses:
        "200":
          description: 'The file and its folder, or empty strings.'
          content:
            application/json:
              schema:
                type: object
                required: [file, folder]
                properties:
                  file: { type: string }
                  folder: { type: string }
        "302": { description: 'On 127.0.0.1 or localhost: the same path at http://puffpai.localhost:<port> (D79).' }
  /v1/recover:
    get:
      tags: [ui]
      summary: 'A plain recovery page, so a broken UI can''t lock the owner out (04 section 5)'
      x-access: public
      x-lane: L5
      security: []
      responses:
        "200": { description: 'text/html' }
        "302": { description: 'On 127.0.0.1 or localhost: the same path at http://puffpai.localhost:<port> (D79). No cookie set or read.' }
  /:
    get:
      tags: [ui]
      summary: 'The active ui package, served at the Core''s root address'
      x-access: public
      x-lane: L5
      security: []
      responses:
        "200": { description: 'The active static ui package''s index page, or a redirect to /pkg/<id>/ for a ui with its own process.' }
        "302": { description: 'On 127.0.0.1 or localhost: the same path at http://puffpai.localhost:<port> (D79). No cookie set or read.' }
  /window/:
    get:
      tags: [ui]
      summary: 'The PuffPAI window''s page (D108)'
      description: 'window.html from the built-in default Desktop, never from the active ui package and never from a Registry row, so a third-party Desktop never runs in the window. Static files hold no owner data, so this is public like "/". Only at http://puffpai.localhost:<port> (D79).'
      x-access: public
      x-lane: window-key
      security: []
      responses:
        "200": { description: 'The page.' }
        "302": { description: 'On 127.0.0.1 or localhost: the same path at http://puffpai.localhost:<port> (D79). No cookie set or read.' }
        "404": { description: 'No such file.' }
  /window/{path}:
    get:
      tags: [ui]
      summary: 'The files of the PuffPAI window''s page (D108)'
      description: 'From the built-in default Desktop only, as /window/, decided on what the path really is on disk. Its one page is window.html; only its .js, .css, .woff2, .jpg and .webp files are served, each with its own type and nosniff. Any other page or type, another spelling of a file, a trailing slash and paths outside the folder are refused.'
      x-access: public
      x-lane: window-key
      security: []
      parameters: [ { name: path, in: path, required: true, schema: { type: string } } ]
      responses:
        "200": { description: 'The file.' }
        "302": { description: 'On 127.0.0.1 or localhost: the same path at http://puffpai.localhost:<port> (D79). No cookie set or read.' }
        "404": { description: 'No such file.' }
  /ui/{path}:
    get:
      tags: [ui]
      summary: 'Files of the active static ui package (added by lane L5; "/" serves only its index)'
      description: 'Static files hold no owner data, so this is public like "/". Paths outside the package folder are refused.'
      x-access: public
      x-lane: L5
      security: []
      parameters: [ { name: path, in: path, required: true, schema: { type: string } } ]
      responses:
        "200": { description: 'The file.' }
        "302": { description: 'On 127.0.0.1 or localhost: the same path at http://puffpai.localhost:<port> (D79). No cookie set or read.' }
        "404": { description: 'No such file.' }
  /v1/programs:
    get:
      tags: [programs]
      summary: 'Her own programs (D16, D138): {"programs": [row], "installed_desktop": [{"name", "path"}]}'
      description: 'A row: id, name, kind (cli or desktop), path, command, added_at, help, commands, always_allow. Only the owner at a paired device, as /v1/dev/shell. Works in safe mode. PROPOSED, not tested by the owner.'
      x-access: owner_device
      x-lane: chat-tools
      responses:
        "200": { description: 'The list.' }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [programs]
      summary: 'Add a program she chose, by its full path or a name on PATH'
      description: 'Body {"kind": "cli" | "desktop", "path" | "command", "name"?}. A command line program''s own help runs once, 10 seconds at most, no shell (never for a shell or interpreter). Audit line. Refused in safe mode.'
      x-access: owner_device
      x-lane: chat-tools
      responses:
        "200": { description: '{"ok": true, "program": row}' }
        "400": { description: 'Not there, or not a program.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: 'Safe mode.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: 'The audit line could not be written, so nothing was added.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/programs/{id}:
    delete:
      tags: [programs]
      summary: 'Remove a program from her list. Works in safe mode (it only narrows).'
      x-access: owner_device
      x-lane: chat-tools
      responses:
        "200": { description: '{"ok": true}' }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: 'No such program.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    patch:
      tags: [programs]
      summary: 'Always allow on or off for one program (D16)'
      description: 'Body {"always_allow": bool}. Reply {"ok": true, "program": row, "warning"?: line}: the warning when this program can start any other. A batch file can''t be on. Turning on is refused in safe mode; turning off always works.'
      x-access: owner_device
      x-lane: chat-tools
      responses:
        "200": { description: '{"ok": true, "program": row, "warning"?}' }
        "400": { description: 'Not a bool, or this program can''t be on.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: 'No such program.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'Safe mode.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: 'The audit line could not be written, so nothing changed.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/programs/{id}/launch:
    post:
      tags: [programs]
      summary: 'Open her desktop program in its own window, optionally with a file'
      description: 'Body {"file"?}: inside her data folder, a linked folder, or a file she pinned. Audit line. Refused in safe mode.'
      x-access: owner_device
      x-lane: chat-tools
      responses:
        "200": { description: '{"ok": true}' }
        "400": { description: 'Not a desktop program of hers, or a file it may not open.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: 'No such program.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'Safe mode.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "500": { description: 'It did not start.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: 'The audit line could not be written, so nothing started.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/dev/shell:
    post:
      tags: [dev]
      summary: 'Open the Developer page''s command line: a FULL shell on the owner''s computer, no Yes before each command'
      description: |
        Built by lane i8c (the owner's rule, 2026-10-06). Body {"shell": "powershell" | "cmd"} (default powershell).
        One persistent shell process in a Job Object the Core makes, started in the owner's home folder with the
        Core's environment minus every PUFFPAI* name and any value holding one of the Core's tokens. PowerShell
        starts with -NoProfile, cmd with /D (no AutoRun). At most 2 open at once. 30 minutes with no input closes
        it; a Core stop closes every shell; entering safe mode closes every shell. What runs here is not checked
        by the Bridge (the Desktop says so). Chat's own command running keeps its per-command Yes.
        Only the owner at a paired device: never an owner API key, a package token, a Toolsmith token, or the
        terminal key the Core writes for its own CLI. The shell belongs to the device that opened it.
        Audit: one line when it opens and one when it closes.
      x-access: owner_device
      x-lane: I8c
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                shell: { type: string, enum: [powershell, cmd], default: powershell }
      responses:
        "201": { description: '{"id", "cwd"}' }
        "400": { description: 'Not "powershell" or "cmd".', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: 'Safe mode: {"error", "code": "safe_mode"}.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: 'Already 2 open: {"error", "code": "too_many"}.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: 'The shell could not start, or the audit line could not be written (then nothing started).', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    get:
      tags: [dev]
      summary: 'The open command lines: [{"id", "shell", "started", "idle_s", "mine"}]'
      description: 'Built by lane i8c. "started" is ISO 8601 UTC; "idle_s" is whole seconds since the last input; "mine" is true for a shell this device opened. Works in safe mode.'
      x-access: owner_device
      x-lane: I8c
      responses:
        "200": { description: 'A list of open shells.' }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/dev/shell/{id}/input:
    post:
      tags: [dev]
      summary: 'Send one line (with Enter) or Ctrl+C to a command line'
      description: |
        Built by lane i8c. Body {"text": "..."} (one line, at most 8000 characters, no line breaks; Enter is added)
        or {"signal": "ctrl_c"}. A line sent while a command runs goes to that command as typed input
        (an answer to its prompt). Ctrl+C ends what the shell is running (every process in its job but the
        shell and its console host); if the shell itself stays busy it starts again in the same folder and
        says so in its output ({"result": "restarted"}). Audit: one line per line sent, with only its length
        and first word (a first word shaped like a key is "[hidden]"); typed input with only its length.
        Never the text, never any output.
      x-access: owner_device
      x-lane: I8c
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        "200": { description: 'Text: {"ok": true, "kind": "line" | "typed"}. Ctrl+C: {"ok": true, "result": "stopped" | "idle" | "restarted"}.' }
        "400": { description: 'Not one line, or not a known signal.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: 'No such shell, it ended, or another device opened it.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'Safe mode.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: 'The audit line could not be written, so nothing was sent.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/dev/shell/{id}/events:
    get:
      tags: [dev]
      summary: 'A command line''s output as server-sent events'
      description: |
        Built by lane i8c. Each event is "id: <seq>" and "data: <json>": {"t", "stream": "out" | "err", "text"}
        ("t" is ISO 8601 UTC), then {"exit": code} when the shell ends (the stream then ends). From the start of
        what is kept (the last 256000 characters, in memory only) unless Last-Event-ID or ?after=<seq> says
        otherwise. The stream also ends after ?timeout=<s> (default 25, at most 60); EventSource reconnects
        with Last-Event-ID, so nothing is lost. An ended shell's events stay readable for 60 seconds.
      x-access: owner_device
      x-lane: I8c
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: after, in: query, schema: { type: integer } }
        - { name: timeout, in: query, schema: { type: integer } }
      responses:
        "200": { description: 'text/event-stream' }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: 'No such shell, or another device opened it.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'Safe mode.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/dev/shell/{id}:
    delete:
      tags: [dev]
      summary: 'Close a command line: its job ends, so everything the shell started ends with it'
      description: 'Built by lane i8c. Any of the owner''s paired devices may close any open shell (closing only narrows). Works in safe mode. Audit: one closed line.'
      x-access: owner_device
      x-lane: I8c
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        "200": { description: '{"ok": true}' }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: 'No such shell.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/folders:
    get:
      tags: [zones]
      summary: 'Zone 1: the data folder and linked folders the Library reads (settings\folders.json)'
      description: |
        Built by I18f. Reply {"data", "data_there", "default", "linked": [{"path", "there"}], "from_setup", "line"}.
        from_setup is what Setup's vault step saved in settings\data.json ({"data", "linked"}) while
        folders.json is not there yet, else null. Every one of these folders is a "never" place for Toolsmith.
      x-access: owner
      x-lane: I18f
      responses:
        "200": { description: 'The folders.' }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/folders/link:
    post:
      tags: [zones]
      summary: 'Link one of her folders: read where it is, never copied or changed'
      description: 'Built by I18f. Body {"path"}: a whole path to a folder that is there; not PuffPAI''s own folder, the data folder or the vault''s folder. Reply: the folders, as GET /v1/folders. No card: the wizard''s vault step links folders the same way.'
      x-access: owner_device
      x-lane: I18f
      responses:
        "200": { description: 'The folders.' }
        "400": { description: 'Not a folder that may be linked.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'Linked already.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/folders/unlink:
    post:
      tags: [zones]
      summary: 'Unlink a folder (its index rows go; the folder itself is never touched)'
      description: 'Built by I18f. Body {"path"}. Reply: the folders.'
      x-access: owner_device
      x-lane: I18f
      responses:
        "200": { description: 'The folders.' }
        "404": { description: 'Not linked.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/folders/from-setup:
    post:
      tags: [zones]
      summary: 'Use the folders Setup saved in settings\data.json'
      description: 'Built by I18f. Writes them into settings\folders.json (the data folder, and each linked folder that is there). Reply: the folders plus {"lines"}.'
      x-access: owner_device
      x-lane: I18f
      responses:
        "200": { description: 'The folders and what was done.' }
        "409": { description: 'Nothing from Setup to use.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/toolsmith/keys:
    get:
      tags: [zones]
      summary: 'Zone 3: per Toolsmith provider, whether its key is kept in the vault (never a value)'
      description: 'Built by I18f. Reply [{"provider", "company", "vault_name", "kept": true | false | null, "get_it"}]. null: the vault is locked or not set up, so it can''t be told.'
      x-access: owner
      x-lane: I18f
      responses:
        "200": { description: 'The providers.' }
  /v1/toolsmith/keys/{provider}:
    put:
      tags: [zones]
      summary: 'Keep Toolsmith''s key for one provider in the vault (toolsmith.<provider>)'
      description: 'Built by I18f. Body {"value"}. Vault open: saved (200); locked: sealed into the vault inbox (202), as the wizard does. The value is never echoed. A key alone sends nothing: Toolsmith uses a company only after her Yes to its sentence (PUT /v1/toolsmith/model).'
      x-access: owner_device
      x-lane: I18f
      parameters: [ { name: provider, in: path, required: true, schema: { type: string } } ]
      responses:
        "200": { description: '{"saved": true, "line"}' }
        "202": { description: '{"saved": false, "line"}: sealed into the inbox.' }
        "400": { description: 'No key in the body.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: 'No such provider.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'The vault is not set up, or can''t take a key now.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [zones]
      summary: 'Take Toolsmith''s key for one provider out of the vault'
      description: 'Built by I18f. The vault must be open.'
      x-access: owner_device
      x-lane: I18f
      parameters: [ { name: provider, in: path, required: true, schema: { type: string } } ]
      responses:
        "200": { description: '{"deleted": true, "line"}' }
        "404": { description: 'No such provider, or no key kept.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "423": { description: 'The vault is locked.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/toolsmith/cap:
    put:
      tags: [zones]
      summary: 'Lower Toolsmith''s cost cap at once'
      description: 'Built by I18f. Body {"cost_cap_usd"}: at most the cap in use. A higher cap is a widening: 409 {"code": "needs_yes"}, and it goes through PUT /v1/toolsmith/model with her Yes to the sentence again.'
      x-access: owner_device
      x-lane: I18f
      responses:
        "200": { description: 'The saved choice.' }
        "400": { description: 'Not a number of dollars.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'Toolsmith is local, or the cap would go up.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/toolsmith/hosts:
    get:
      tags: [zones]
      summary: 'The places Toolsmith may reach, as v2 models them (read only)'
      description: 'Built by I18f. Reply {"search": {"hosts", "on", "switch"}, "search_yes_names": [the hosts her live search Yes names], "web": {"hosts": {id: host}}, "cloud": {"company", "hosts", "on"}, "knowledge": {"hosts", "also"}, "known": {company: [hosts]}, "grants": [{"subject", "host", "phase"}], "line"}.'
      x-access: owner
      x-lane: I18f
      responses:
        "200": { description: 'The hosts.' }
  /v1/bridge/search:
    post:
      tags: [zones]
      summary: 'Toolsmith''s build-time search: on raises a Yes card, off is at once'
      description: 'Built by I18f. Body {"on"}. On: 202 with a host Yes card naming every place and exactly the wizard''s search hosts (build phase); her Yes on it turns the switch on (the Bridge''s own Yes listener). Off: 200, the switch is off (the Bridge view).'
      x-access: owner_device
      x-lane: I18f
      responses:
        "200": { description: 'Off: the Bridge view.' }
        "202": { description: '{"consent_id", "card_sha", "title", "lines"}' }
        "400": { description: 'No on in the body.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/bridge/addresses:
    get:
      tags: [addresses]
      summary: 'The addresses the owner allowed for packages, and the installed packages her form may pick'
      description: 'Built by lan-address (D110). Reply {"addresses": [{"consent_id", "package", "name", "address", "port", "where": "lan" | "internet", "where_said": "home network" | "internet", "state": "on" | "waiting", "line"}], "setting": "open" | "closed", "note", "packages": [{"id", "name"}]}. on: it can be used now (the Bridge open, its switch on, its Yes live, not on a block list). note: why the rows are empty when the machine key is missing.'
      x-access: owner
      x-lane: lan-address
      responses:
        "200": { description: 'The rows.' }
    post:
      tags: [addresses]
      summary: 'The owner''s own form: raise the Yes card for one address and port for one package. It never grants'
      description: 'Built by lan-address (D110). Body {"package", "address"}. Any installed package but BuildBot''s own parts, a build''s tries and a raw reader; either kind; no manifest field needed and no limit. It replaces any waiting card of that package, and takes over a package''s card for the same address. address is host:port, or a scheme that implies the port (https 443, http 80), with no path, user part, wildcard or space. Reply {"state": "allowed" | "waiting" | "not_needed" | "refused", "line"}, and for a card also {"consent_id", "card_sha", "title", "lines"}. The grant comes only from her Yes on POST /v1/consent/{id}/answer.'
      x-access: owner_device
      x-lane: lan-address
      responses:
        "200": { description: 'Allowed already, not needed (a service on this computer), or her Yes stands and its grant can not be read now. No card.' }
        "202": { description: 'Waiting: its Yes card is in the reply.' }
        "400": { description: 'Refused, with one plain line that never repeats what was typed. No card.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: 'That package is not installed.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: 'No machine key, so no card can be sealed.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/bridge/addresses/ask:
    post:
      tags: [addresses]
      summary: 'A package asks for one address and port for itself. It never grants'
      description: 'Built by lan-address (D110). A package token only, and always for that package: nothing in the body can name another. Body {"address"}, as in the owner''s form. Its installed manifest must declare needs.addresses, and it may ask only for the kind it declared ("lan" or "internet"). Reply {"state": "allowed" | "waiting" | "not_needed" | "refused", "line"}: its own state, never a card''s id or fingerprint. A refusal also carries "error", the same words as "line". One waiting card per package: a different address replaces the package''s own waiting card, but never one the owner raised (429, no card). At most 5 new cards an hour that the package raised, and an address she declined is not raised again for an hour.'
      x-access: package_ok
      x-lane: lan-address
      responses:
        "200": { description: 'Allowed (her Yes stands), or not needed (a service on this computer).' }
        "202": { description: 'Waiting for her Yes.' }
        "400": { description: 'The address is refused, with one plain line. No card.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: 'Not a package token, not declared, the other kind, or a package that may not hold an address.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: 'No card now: a limit, an address she declined, or the owner has another address waiting for this package.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: 'No card could be raised right now.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/bridge/addresses/{consent_id}:
    delete:
      tags: [addresses]
      summary: 'Remove one address: its Yes and its grant, one action'
      description: 'Built by lan-address (D110). consent_id is the row''s, for a card still waiting or a Yes. Reply {"deleted": true, "line"}.'
      x-access: owner_device
      x-lane: lan-address
      parameters:
        - { name: consent_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: 'Removed.' }
        "404": { description: 'No such address.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'That Yes could not be taken back.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/toolsmith/search-key/{row_id}:
    get:
      tags: [github]
      summary: 'Whether the owner''s own web search key is kept in the vault (toolsmith.<id>) and her Yes for it is live, never a value'
      description: 'Reply {"linked": true | false | null, "yes", "vault", "vault_name", "host", "says", "line"}. null: the vault is locked or not set up, so it can''t be told.'
      x-access: owner
      x-lane: I18g
      parameters:
        - { name: row_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: 'Linked or not.' }
        "404": { description: 'No such row in sources.json web.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    put:
      tags: [github]
      summary: 'Keep the owner''s own web search key in the vault as toolsmith.<id> and raise its own Yes card'
      description: 'Body {"value"}. Refused (400) unless it has a key''s strict shape (web_key_ok). Vault open: saved (200); locked: sealed into the vault inbox (202). Reply {"saved", "line", "yes", "consent_id", "card_sha", "title", "lines"}: a host card, subject toolsmith:search, exactly that row''s one host, build phase; no card when her Yes for it already stands. The value is never echoed.'
      x-access: owner_device
      x-lane: I18g
      parameters:
        - { name: row_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: 'Saved in the vault.' }
        "202": { description: 'Sealed into the vault inbox.' }
        "400": { description: 'Not a key''s shape; nothing was saved.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: 'No such row in sources.json web.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'No vault yet.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [github]
      summary: 'Take back her Yes for this key and take the key out of the vault'
      description: 'Her Yes goes whatever else happens. The vault locked: 423, the key stays until she unlocks and removes it again.'
      x-access: owner_device
      x-lane: I18g
      parameters:
        - { name: row_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: 'Removed.' }
        "404": { description: 'No such row, or nothing kept.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "423": { description: 'Her Yes is taken back; the vault is locked, so the key stays for now.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/toolsmith/apis:
    get:
      tags: [owner_apis]
      summary: 'The search APIs the owner added herself, with their state, never a key'
      description: 'Reply {"apis": [{"id", "name", "host", "search", "key_in", "key_name", "key_prefix", "fields", "tested", "yes", "linked", "on", "line"}], "vault"}. linked null: no key, or the vault is locked. linked false: no key kept, or one kept for another address (save it again). on: tested, her Yes live, its key kept, Toolsmith''s search on.'
      x-access: owner
      x-lane: add-api
      responses:
        "200": { description: 'The rows.' }
    post:
      tags: [owner_apis]
      summary: 'Add one search API. Only the owner, only here: it stays off until her Yes and a Test that reads results'
      description: 'Body {"name", "search", "n", "key_in", "key_name", "key_prefix", "fields"}. key_prefix: "", "Bearer" or "Token", only with key_in header. search: https, a public host, {q} once as a whole query value or path part, {n} optional. A row with no key raises its Yes card here; a row with a key raises it when the key is saved. Reply {"id", "line", "yes", "consent_id", "card_sha", "title", "lines"}. Her Yes never turns Toolsmith''s search on.'
      x-access: owner_device
      x-lane: add-api
      responses:
        "201": { description: 'Added, off.' }
