        "409": { description: 'It could not be done: {error, kind: not_built|refused|job_held|cloud_held|cloud_offline|cloud_wait_vault|cloud_error, code}.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/toolsmith/agent/steps:
    post:
      tags: [toolsmith]
      summary: 'Raise a "Your turn" Checklist step for a job (a run_command step is zone checked first). Body {job_id, step, try_id}; reply {id}'
      x-access: toolsmith
      x-lane: L6
      responses:
        "200": { description: 'Done (plain words in said where it says no).' }
        "409": { description: 'It could not be done: {error, kind: not_built|refused|job_held|cloud_held|cloud_offline|cloud_wait_vault|cloud_error, code}.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/toolsmith/agent/steps/{step_id}:
    get:
      tags: [toolsmith]
      summary: 'The state of a step this build raised: open, done, skipped or gone'
      x-access: toolsmith
      x-lane: L6
      parameters: [ { name: step_id, in: path, required: true, schema: { type: string } } ]
      responses:
        "200": { description: 'Done (plain words in said where it says no).' }
        "409": { description: 'It could not be done: {error, kind: not_built|refused|job_held|cloud_held|cloud_offline|cloud_wait_vault|cloud_error, code}.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/wizard:
    get:
      tags: [wizard]
      summary: 'Wizard steps and progress'
      description: 'Reply {"steps": [{id, title, required, state}], "current": "<step id or null>", "complete": bool, "platform": "windows | mac | linux"}. state is todo, done, waiting or not_built.'
      x-access: owner
      x-lane: L5
      responses:
        "200": { description: 'Steps and progress.' }
  /v1/wizard/{step}:
    post:
      tags: [wizard]
      summary: 'Answer one wizard step'
      description: |
        Body {"answers": {"<field id>": value}, "renderer": "browser"}. Send {} to start a step.
        Reply, one screen: {"status": "ask | show | done | waiting | not_built", "step", "title",
        "lines": [plain lines], "answered": [{field, label, shown}], "field": the field to ask now
        (resolved for this platform), "show": {"field", "value"} for show_once only, "error",
        "clear": bool, "next"}. A field that show_when hides is never asked; a hidden answer that
        arrives anyway is dropped with a line. Secrets are never echoed and never kept in wizard
        progress (D36).
      x-access: owner
      x-lane: L5
      parameters: [ { name: step, in: path, required: true, schema: { type: string } } ]
      responses:
        "200": { description: 'The next screen.' }
        "404": { description: 'No such step.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/knowledge/upload:
    post:
      tags: [knowledge]
      summary: 'One file from the device she is at, into her data folder (D134)'
      description: |
        Query name=<file name>; the body is the file's bytes (application/octet-stream). It lands in the data folder's
        uploads folder under that name. No path from the client is ever used. The name must be plain and end in .txt, .md,
        .docx or .pdf; the same check as a pinned file runs (folders.file_problem). At most 50 MB, enforced while reading.
        A second upload of one name replaces the first, whole, and the reply says so. Answers
        {"ok": true, "name", "path", "size", "replaced": bool, "pinned": bool, "line"}. A paired browser with both halves
        (with its Origin and X-PuffPAI: 1), or this computer's terminal key; never an owner API key or a package token.
      x-access: owner_device
      x-lane: D134
      parameters:
        - { name: name, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: 'Saved.' }
        "400": { description: 'A name that can not be used, the wrong kind of file, an empty file, or a place that can not be checked.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "413": { description: 'Over 50 MB. On the network listener a declared size over 86 MB is refused from its headers, in plain text.' }
        "507": { description: 'It could not be saved (out of room).', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/knowledge/sources:
    get:
      tags: [knowledge]
      summary: 'What Toolsmith''s builds read into the bot''s knowledge: per item its source, title, url, license, size and date'
      description: |
        Built by I11. Read from the data folder's knowledge\<source>\meta.json files only (nothing reaches the
        network). Reply {"items": [{"source": "wikipedia | gutenberg", "title", "url", "license", "size",
        "fetched_at", "file"}], "count", "bytes", "libraries": [{"source", "title", "size", "zim", "line"}], "waiting":
        [{"name", "line"}], "drop_folder"}, newest first (D136). An address that is not its source's own is "". The owner
        on a paired device only: an owner API key, a package token and a Toolsmith token are refused.
      x-access: owner_device
      x-lane: I11
      responses:
        "200": { description: 'The items.' }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/owner-files:
    get:
      tags: [knowledge]
      summary: 'Where a package with needs.owner_files makes files, or where one file is'
      description: 'Query ?path=. No path: {"made"}. A path: {"path", "place": "made | mine | linked"} or {"line"}. 403 for a package token whose manifest has no needs.owner_files.'
      x-access: package_ok
      x-lane: D136
      responses:
        "200": { description: 'The answer.' }
        "400": { description: 'A plain reason.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/knowledge/files:
    get:
      tags: [knowledge]
      summary: 'The newest 30 files in My files'
      description: 'Reply {"files": [{"name", "folder", "path", "modified"}]}.'
      x-access: owner
      x-lane: D136
      responses:
        "200": { description: 'The answer.' }
        "400": { description: 'A plain reason.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/knowledge/files/open:
    post:
      tags: [knowledge]
      summary: 'Open one file in its own app, on the bot''s computer. On the home network: the file itself, as a download (D130)'
      description: 'Body {"path"}: in her data folder or a linked folder, never a file that runs as a program. Reply {"opened": true}. 400 {"error"}.'
      x-access: owner_device
      x-lane: D136
      responses:
        "200": { description: 'The answer.' }
        "400": { description: 'A plain reason.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/knowledge/find:
    post:
      tags: [knowledge]
      summary: 'Find more books: a plan for books only, up to its Yes card'
      description: 'Body {"words"}. No app is looked for and no model asked. Nothing downloads before her Yes on the plan card (D99). Reply: the build, as POST /v1/toolsmith/plan.'
      x-access: owner_device
      x-lane: D136
      responses:
        "200": { description: 'The answer.' }
        "400": { description: 'A plain reason.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/knowledge/books/remove:
    post:
      tags: [knowledge]
      summary: 'Remove one item, or a whole source, from the disk and the index'
      description: 'Body {"source", "file"?}. Reply {"removed"}. 400 {"error"}: not one of hers, gone, a link, or a move is running. 409: Toolsmith is downloading.'
      x-access: owner_device
      x-lane: D136
      responses:
        "200": { description: 'The answer.' }
        "400": { description: 'A plain reason.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/knowledge/books/look:
    post:
      tags: [knowledge]
      summary: 'Look for a dropped .zim now'
      description: 'Reply {"looking", "waiting": [{"name", "line"}]}.'
      x-access: owner_device
      x-lane: D136
      responses:
        "200": { description: 'The answer.' }
        "400": { description: 'A plain reason.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/knowledge/books/read:
    get:
      tags: [knowledge]
      summary: 'Read one kept text, a part at a time'
      description: 'Query ?source&file&part. Reply {"title", "text", "part", "parts"}. 400 {"error"}.'
      x-access: owner_device
      x-lane: D136
      responses:
        "200": { description: 'The answer.' }
        "400": { description: 'A plain reason.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/knowledge/books/articles:
    get:
      tags: [knowledge]
      summary: 'A page of an offline library''s articles by title'
      description: 'Query ?source&q&page. Reply {"articles": [{"title", "url"}], "has_more"}. 400 {"error"}.'
      x-access: owner_device
      x-lane: D136
      responses:
        "200": { description: 'The answer.' }
        "400": { description: 'A plain reason.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/knowledge/books/article:
