      description: 'Query ?source&url. Reply {"title", "url", "text"}. 400 {"error"}.'
      x-access: owner_device
      x-lane: D136
      responses:
        "200": { description: 'The answer.' }
        "400": { description: 'A plain reason.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/knowledge/pinned:
    get:
      tags: [knowledge]
      summary: 'The documents pinned to this bot'
      description: 'Reply {"pinned": [{"name", "path", "line"}], "line"}.'
      x-access: owner
