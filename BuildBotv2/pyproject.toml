[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "puffpai-core"
version = "0.1.0"
description = "PuffPAI BuildBot Core: three zones, seven agents, the Registry, the Bus and the Core API."
requires-python = ">=3.11"
authors = [{ name = "Cypher Sisters" }]
dependencies = [
  "flask>=3.0",
  "waitress>=3.0",
  "jsonschema>=4.20",
  "mcp>=1.0",
  "cryptography>=48.0.1",
  'pywebview>=6,<7; sys_platform == "win32"',
  "zstandard>=0.22.0",
  "pypdf>=6.0.0,<7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]

[project.scripts]
puffpai = "puffpai_core.cli:main"

[tool.setuptools.packages.find]
where = ["core"]

[tool.setuptools.package-data]
puffpai_core = ["puff.ico", "zone2/data/*.json", "zone3/data/*.dat", "zone3/toolsmith/data/*.json",
                "zone3/toolsmith_host/data/*.json", "zone3/toolsmith_host/providers/*/puffpai.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["core"]
markers = [
  "docker: needs Docker Desktop running (skipped when it is not)",
  "live: uses this computer's real model server (Ollama); skipped when no small tool model is installed",
  "e2e: the integration run on real parts (Core, vault, Drawbridge, FreshTable, the local model)",
]
